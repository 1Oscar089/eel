<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Permisos - Iconic Edition</title>
    
    <link href='https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preload" href="../css/userbar.css" as="style"><link rel="preload" href="../css/admin-sidebar.css" as="style">
    <link rel="stylesheet" href="../css/userbar.css"><link rel="stylesheet" href="../css/admin-sidebar.css">

    <style>
        /* REGLAS ESTRICTAS DE LAYOUT ICONIC EDITION */
        :root { --primary-dark:#243C4C; --primary-steel:#5289AD; --accent:#698696; --border:#ACBCBF; --bg-light:#F4FCFB; --gap:0.5rem; --success:#16a34a; --warning:#d97706; --danger:#dc2626; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif !important; }
        
        html, body { background: var(--bg-light); color: var(--primary-dark); width: 100vw !important; max-width: 100vw !important; overflow-x: hidden !important; position: relative; }
        
        .admin-main { height: calc(100vh - 60px); width: 100% !important; max-width: 100vw; overflow-y: auto; overflow-x: hidden !important; -ms-overflow-style: none; scrollbar-width: none; padding: var(--gap); }
        .admin-main::-webkit-scrollbar { display: none; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .page-header { margin-bottom: var(--gap); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .page-header h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -1px; margin: 0; }
        
        .header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn-link { background: white; border: 1px solid var(--border); color: var(--primary-steel); padding: 0.5rem 0.8rem; border-radius: 8px; font-weight: 800; font-size: 0.75rem; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; transition: 0.2s; }
        .btn-link:hover { background: #e0f2fe; border-color: var(--primary-steel); }

        .tabs-header { display: flex; gap: 0.5rem; margin-bottom: var(--gap); border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; overflow-x: auto; white-space: nowrap; -ms-overflow-style: none; scrollbar-width: none; }
        .tabs-header::-webkit-scrollbar { display: none; }
        .tab-btn { background: transparent; border: 1px solid transparent; padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 800; color: var(--accent); cursor: pointer; border-radius: 8px; transition: 0.2s; display: flex; align-items: center; gap: 0.4rem; }
        .tab-btn:hover { background: white; border-color: var(--border); color: var(--primary-steel); }
        .tab-btn.active { background: var(--primary-dark); color: white; border-color: var(--primary-dark); }

        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }

        .controls-card { background: white; padding: 1rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: var(--gap); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        
        .form-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 0.8rem; }
        .form-grid > div { grid-column: span 12; }
        .form-group { display: flex; flex-direction: column; gap: 0.2rem; }
        .form-group label { font-size: 0.65rem; font-weight: 800; color: var(--accent); text-transform: uppercase; }
        .form-group input, .form-group select { padding: 0.5rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; outline: none; font-size: 0.85rem; font-weight: 700; color: var(--primary-dark); background: var(--bg-light); width: 100%; transition: 0.2s; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary-steel); background: #e0f2fe; }
        .form-group input[readonly] { background: #f1f5f9; color: var(--accent); border-color: #e2e8f0; cursor: not-allowed; }

        .radio-group { display: flex; gap: 1rem; align-items: center; height: 100%; padding: 0.3rem 0; }
        .radio-label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.8rem; font-weight: 700; color: var(--primary-dark); }
        .radio-label input[type="radio"] { width: auto; cursor: pointer; accent-color: var(--primary-steel); }

        .btn-primary { background: var(--primary-dark); color: white; padding: 0.7rem 1rem; border-radius: 6px; font-weight: 800; font-size: 0.85rem; cursor: pointer; border: none; width: 100%; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 0.5rem; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-steel); }
        .btn-calc { background: var(--primary-steel); color: white; padding: 0.5rem 0.8rem; border-radius: 6px; font-weight: 800; font-size: 0.8rem; cursor: pointer; border: none; width: 100%; transition: 0.2s; display: none; }
        .btn-calc:hover { background: #407294; }

        /* HISTORIAL GRID */
        .hist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0.8rem; margin-top: 1rem; }
        .hist-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02); display: flex; flex-direction: column;}
        .hist-card:hover { border-color: var(--primary-steel); box-shadow: 0 6px 15px rgba(82,137,173,0.1); transform: translateY(-2px); }
        .hist-card h4 { font-size: 1.05rem; font-weight: 800; margin-bottom: 0.2rem; color: var(--primary-dark); }
        
        .permiso-row { background: var(--bg-light); border-left: 3px solid var(--primary-steel); padding: 0.6rem 0.8rem; border-radius: 6px; margin-bottom: 0.5rem; font-size: 0.75rem; display: flex; flex-direction: column; gap: 0.3rem; }
        .permiso-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .permiso-top strong { color: var(--primary-dark); display: block; margin-bottom: 0.1rem; font-size: 0.85rem;}
        .permiso-top span { color: var(--accent); font-weight: 700; display: block; font-size: 0.75rem;}
        
        .time-badge { background: #e0f2fe; color: var(--primary-steel); padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 800; font-size: 0.75rem; display: inline-block; white-space: nowrap; }

        .permiso-checks { display: flex; gap: 1rem; margin-top: 0.2rem; border-top: 1px dashed var(--border); padding-top: 0.4rem; }
        .check-label { display: flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; font-weight: 800; color: var(--accent); cursor: pointer; user-select: none; }
        .check-label input { accent-color: var(--primary-steel); cursor: pointer; width: 14px; height: 14px;}

        .empty-state { text-align: center; padding: 2rem; color: var(--accent); font-style: italic; font-size: 0.85rem; font-weight: 600; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(36, 60, 76, 0.6); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 0.5rem; backdrop-filter: blur(2px); }
        .modal-overlay.active { display: flex; }
        .modal { background: white; padding: 1.5rem; border-radius: 16px; width: 100%; max-width: 650px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.2);}
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .modal-header h2 { font-size: 1.2rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 0.2rem; }
        .modal-header p { font-size: 0.8rem; color: var(--accent); font-weight: 700; }
        .btn-close { background: #f1f5f9; border: none; font-size: 1.5rem; color: var(--accent); cursor: pointer; border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; transition: 0.2s;}
        .btn-close:hover { background: #e2e8f0; color: var(--danger); }
        .modal-body { overflow-y: auto; flex: 1; scrollbar-width: thin; padding-right: 5px;}

        @media (max-width: 768px) {
            .form-grid > div { grid-column: span 12 !important; }
        }
    </style>
</head>
<body>

    <div id="userbar-root"></div>
    <div class="admin-layout">
        <div id="admin-sidebar-root"></div>
        <main class="admin-main">
            
            <div class="page-header">
                <h1>Control de Permisos</h1>
                <div class="header-actions" id="adminActions" style="display: none;">
                    <a href="reporte-permisos.html" class="btn-link"><i class='bx bxs-file-pdf'></i> Exportar Reportes</a>
                </div>
            </div>

            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab('agregar')"><i class='bx bx-plus-circle'></i> Registrar Permiso</button>
                <button class="tab-btn" onclick="switchTab('historial')"><i class='bx bx-history'></i> Historial Anual</button>
            </div>

            <div id="tab-agregar" class="tab-content active">
                <div class="controls-card">
                    <div class="form-grid">
                        
                        <div class="form-group" style="grid-column: span 6;">
                            <label>Seleccionar Docente / Personal</label>
                            <select id="docenteSelect" onchange="validarFormulario()">
                                <option value="" disabled selected>Cargando personal...</option>
                            </select>
                        </div>
                        <div class="form-group" style="grid-column: span 3;">
                            <label>ID / N° de Permiso</label>
                            <input type="text" id="permisoId" placeholder="Ej: PER-001" oninput="validarFormulario()">
                        </div>
                        <div class="form-group" style="grid-column: span 3;">
                            <label>Fecha de Registro</label>
                            <input type="date" id="fechaRegistro" readonly>
                        </div>

                        <div class="form-group" style="grid-column: span 8;">
                            <label>Clasificación / Motivo del Permiso</label>
                            <select id="tipoPermiso" onchange="validarFormulario()">
                                <option value="" disabled selected>[Seleccione motivo]</option>
                                <option value="Actividad sindical">Actividad sindical</option>
                                <option value="Beca por estudios al exterior (con goce de sueldo)">Beca por estudios al exterior (con goce de sueldo)</option>
                                <option value="Beca por estudios al exterior (sin goce de sueldo)">Beca por estudios al exterior (sin goce de sueldo)</option>
                                <option value="Cargo de elección popular/Asamblea Legislativa/Gobernador Deptal">Cargo de elección popular/Asamblea Legislativa/Gobernador Deptal</option>
                                <option value="Cargos de Administración Superior/Organismos Carrera Docente">Cargos de Administración Superior/Organismos Carrera Docente</option>
                                <option value="Delegación deportiva, cultural y científica">Delegación deportiva, cultural y científica</option>
                                <option value="Desempeñar cargos de jurado del Tribunal de Justicia">Desempeñar cargos de jurado del Tribunal de Justicia</option>
                                <option value="Desempeño de funciones electorales">Desempeño de funciones electorales</option>
                                <option value="Enfermedad con certificado de incapacidad médica (sin goce de sueldo)">Enfermedad con certificado de incapacidad médica (sin goce de sueldo)</option>
                                <option value="Enfermedad con certificado médico o incapacidad médica (con goce de sueldo)">Enfermedad con certificado médico o incapacidad médica (con goce de sueldo)</option>
                                <option value="Enfermedad grave y duelo de parientes (Padre, Madre, Cónyuge, hijos/as)">Enfermedad grave y duelo de parientes (Padre, Madre, Cónyuge, hijos/as)</option>
                                <option value="Enfermedades terminales e incapacitantes para ejercicio docencia (DL636)">Enfermedades terminales e incapacitantes para ejercicio docencia (DL636)</option>
                                <option value="Maternidad">Maternidad</option>
                                <option value="Miembros de Concejos Municipales (sesiones)">Miembros de Concejos Municipales (sesiones)</option>
                                <option value="Otros (numeral 7, Art. 5 ley de asuetos)">Otros (numeral 7, Art. 5 ley de asuetos)</option>
                                <option value="Paternidad">Paternidad</option>
                                <option value="Permiso por enfermedades crónicas incapacitantes (DL 247)">Permiso por enfermedades crónicas incapacitantes (DL 247)</option>
                                <option value="Personal (con goce de sueldo)">Personal (con goce de sueldo)</option>
                                <option value="Personal (sin goce de sueldo)">Personal (sin goce de sueldo)</option>
                            </select>
                        </div>
                        <div class="form-group" style="grid-column: span 4;">
                            <label>Días u Horas</label>
                            <div class="radio-group">
                                <label class="radio-label"><input type="radio" name="unidadTiempo" value="dias" checked onchange="toggleTimeInputs()"> Días</label>
                                <label class="radio-label"><input type="radio" name="unidadTiempo" value="horas" onchange="toggleTimeInputs()"> Horas</label>
                            </div>
                        </div>

                        <div class="form-group" id="groupFechaInicio" style="grid-column: span 4;">
                            <label>Desde (Fecha)</label>
                            <input type="date" id="fechaInicio" oninput="verificarCalculo()">
                        </div>
                        <div class="form-group" id="groupFechaFin" style="grid-column: span 4;">
                            <label>Hasta (Fecha)</label>
                            <input type="date" id="fechaFin" oninput="verificarCalculo()">
                        </div>

                        <div class="form-group" id="groupHoraInicio" style="grid-column: span 2; display: none;">
                            <label>Hora Inicio</label>
                            <input type="time" id="horaInicio" oninput="verificarCalculo()">
                        </div>
                        <div class="form-group" id="groupHoraFin" style="grid-column: span 2; display: none;">
                            <label>Hora Fin</label>
                            <input type="time" id="horaFin" oninput="verificarCalculo()">
                        </div>

                        <div class="form-group" style="grid-column: span 4; display: flex; flex-direction: column; justify-content: flex-end;">
                            <button type="button" id="btnCalcular" class="btn-calc" onclick="calcularTiempo()"><i class='bx bx-calculator'></i> Calcular Total</button>
                            <input type="text" id="tiempoTotal" readonly placeholder="Total calculado" style="display: none; background: #e0f2fe; color: var(--primary-steel); text-align: center;">
                            <input type="hidden" id="valorNumericoTotal">
                        </div>

                        <div style="grid-column: span 12; margin-top: 0.5rem;">
                            <button id="btnAsignar" class="btn-primary" onclick="guardarPermiso()" disabled><i class='bx bx-save'></i> Registrar Permiso</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-historial" class="tab-content">
                <div class="controls-card">
                    <div style="display:flex; gap:0.5rem; align-items:flex-end; flex-wrap:wrap;">
                        <div class="form-group" style="width: 150px;">
                            <label>Año Lectivo</label>
                            <input type="number" id="hist_anio" value="2026">
                        </div>
                        <button class="btn-primary" style="width:auto; margin-bottom: 1px;" onclick="listarHistorialPermisos()"><i class='bx bx-search'></i> Ver Historial</button>
                    </div>

                    <div id="listaHistorial" class="hist-grid"></div>
                    <div id="msgSinResultados" class="empty-state" style="display:none;">Sin registros en este año.</div>
                </div>
            </div>

            <div style="height: 3rem;"></div>
        </main>
    </div>

    <div id="modalHistorial" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <div>
                    <h2 id="modalHistTitle">Nombre del Docente</h2>
                    <p id="modalHistSubtitle">Historial de Permisos</p>
                </div>
                <button class="btn-close" onclick="document.getElementById('modalHistorial').classList.remove('active')"><i class='bx bx-x'></i></button>
            </div>
            <div class="modal-body" id="modalHistBody">
                </div>
        </div>
    </div>

    <script type="module">
        import { initUserbar } from '../js/userbar.js';
        import { initAdminSidebar } from '../js/admin-sidebar.js';
        
        await initUserbar({ brandHref: '../index.html' }); 
        await initAdminSidebar();
    </script>

    <script type="module">
        import { auth, db } from '../js/initFirebase.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { collection, getDocs, doc, getDoc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        let allDocentes = [];
        let adminName = "Usuario";
        let globalCacheHistory = {}; 

        // LÍMITES OFICIALES SEGÚN LEY SALVADOREÑA
        const LIMITES = { personales: 5, incapacidad: 90, duelo: 20, sinsueldo: 60, maternidad: 112, paternidad: 3 };

        function categorizarPermiso(tipoString) {
            if (!tipoString) return "otros";
            const t = tipoString.toLowerCase();
            if(t.includes("personal (con goce")) return "personales";
            if(t.includes("incapacidad") || t.includes("certificado médico")) return "incapacidad";
            if(t.includes("duelo") || t.includes("parientes")) return "duelo";
            if(t.includes("sin goce")) return "sinsueldo";
            if(t.includes("maternidad")) return "maternidad";
            if(t.includes("paternidad")) return "paternidad";
            return "otros";
        }

        const formatDateShortStr = (str) => {
            if(!str) return "---";
            const [y,m,d] = str.split('-'); return `${d}/${m}/${y}`;
        };

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('fechaRegistro').value = new Date().toISOString().split('T')[0];
            document.getElementById('hist_anio').value = new Date().getFullYear();

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    try {
                        const snap = await getDocs(collection(db, "docentes"));
                        allDocentes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        
                        const myDoc = allDocentes.find(d => d.correo === user.email);
                        if(myDoc) {
                            adminName = myDoc.nombre || myDoc.name || user.email;
                            const cargo = (myDoc.cargo || '').toLowerCase();
                            
                            if(cargo === 'director' || cargo.includes('subdirector')) {
                                document.getElementById('adminActions').style.display = 'flex';
                            }
                        }

                        const select = document.getElementById('docenteSelect');
                        select.innerHTML = '<option value="" disabled selected>-- Elija un Docente --</option>' + 
                            allDocentes.sort((a,b)=> (a.nombre||a.name||'').localeCompare(b.nombre||b.name||'')).map(d => `<option value="${d.id}">${d.nombre||d.name}</option>`).join('');

                        validarFormulario();

                    } catch(e) { console.error("Error validando sesión:", e); }
                } else {
                    window.location.href = '../index.html';
                }
            });
        });

        window.switchTab = (t) => {
            document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${t}`).classList.add('active');
            document.querySelector(`.tab-btn[onclick="switchTab('${t}')"]`).classList.add('active');
        };

        window.toggleTimeInputs = () => {
            const u = document.querySelector('input[name="unidadTiempo"]:checked').value;
            
            document.getElementById('fechaInicio').value = "";
            document.getElementById('fechaFin').value = "";
            document.getElementById('horaInicio').value = "";
            document.getElementById('horaFin').value = "";
            document.getElementById('tiempoTotal').value = "";
            document.getElementById('tiempoTotal').style.display = 'none';
            document.getElementById('valorNumericoTotal').value = "";
            document.getElementById('btnCalcular').style.display = 'none';

            if (u === 'dias') {
                document.getElementById('groupFechaFin').style.display = 'flex';
                document.getElementById('groupHoraInicio').style.display = 'none';
                document.getElementById('groupHoraFin').style.display = 'none';
                document.querySelector('#groupFechaInicio label').innerText = "Desde (Fecha)";
                document.getElementById('groupFechaInicio').style.gridColumn = "span 4";
            } else {
                document.getElementById('groupFechaFin').style.display = 'none';
                document.getElementById('groupHoraInicio').style.display = 'flex';
                document.getElementById('groupHoraFin').style.display = 'flex';
                document.querySelector('#groupFechaInicio label').innerText = "Fecha del Permiso";
                document.getElementById('groupFechaInicio').style.gridColumn = "span 4";
            }
            validarFormulario();
        };

        window.verificarCalculo = () => {
            const u = document.querySelector('input[name="unidadTiempo"]:checked').value;
            let ready = false;
            
            document.getElementById('tiempoTotal').style.display = 'none';
            document.getElementById('valorNumericoTotal').value = "";
            
            if(u === 'dias') {
                ready = document.getElementById('fechaInicio').value && document.getElementById('fechaFin').value;
            } else {
                ready = document.getElementById('fechaInicio').value && document.getElementById('horaInicio').value && document.getElementById('horaFin').value;
            }
            
            document.getElementById('btnCalcular').style.display = ready ? 'flex' : 'none';
            validarFormulario();
        };

        window.calcularTiempo = () => {
            const u = document.querySelector('input[name="unidadTiempo"]:checked').value;
            const res = document.getElementById('tiempoTotal');
            const num = document.getElementById('valorNumericoTotal');
            
            if (u === 'dias') {
                const d1 = new Date(document.getElementById('fechaInicio').value);
                const d2 = new Date(document.getElementById('fechaFin').value);
                if (d2 < d1) { alert("La fecha final no puede ser anterior."); return; }
                const diff = Math.ceil(Math.abs(d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
                res.value = `${diff} Día(s)`; num.value = diff;
            } else {
                const [h1, m1] = document.getElementById('horaInicio').value.split(':').map(Number);
                const [h2, m2] = document.getElementById('horaFin').value.split(':').map(Number);
                let mins = (h2 * 60 + m2) - (h1 * 60 + m1);
                if (mins <= 0) { alert("Hora final inválida."); return; }
                res.value = `${Math.floor(mins/60)}h ${mins%60}m`; num.value = (mins/60).toFixed(2);
            }
            
            res.style.display = 'block'; document.getElementById('btnCalcular').style.display = 'none';
            validarFormulario();
        };

        window.validarFormulario = () => {
            const ok = document.getElementById('docenteSelect').value && 
                       document.getElementById('permisoId').value && 
                       document.getElementById('tipoPermiso').value && 
                       document.getElementById('valorNumericoTotal').value;
            document.getElementById('btnAsignar').disabled = !ok;
        };

        window.guardarPermiso = async () => {
            const btn = document.getElementById('btnAsignar'); btn.disabled = true; btn.innerHTML = "Guardando...";
            const idDoc = document.getElementById('docenteSelect').value;
            const anio = document.getElementById('fechaRegistro').value.split('-')[0];
            const u = document.querySelector('input[name="unidadTiempo"]:checked').value;
            
            const ts = Date.now();
            const recId = `p_${ts}`;
            const payload = {
                idVisual: document.getElementById('permisoId').value,
                fechaRegistro: document.getElementById('fechaRegistro').value,
                tipo: document.getElementById('tipoPermiso').value,
                unidad: u,
                fechaInicio: document.getElementById('fechaInicio').value,
                fechaFin: u === 'dias' ? document.getElementById('fechaFin').value : document.getElementById('fechaInicio').value,
                horaInicio: u === 'horas' ? document.getElementById('horaInicio').value : null,
                horaFin: u === 'horas' ? document.getElementById('horaFin').value : null,
                cantidadCalculada: parseFloat(document.getElementById('valorNumericoTotal').value),
                textoCalculado: document.getElementById('tiempoTotal').value,
                enficha: false,
                enlibro: false,
                registradoPor: adminName,
                timestamp: ts
            };

            try {
                const batch = writeBatch(db);
                batch.set(doc(db, "docentes", idDoc, "metadata", "permisos"), { [recId]: payload }, { merge: true });
                batch.update(doc(db, "docentes", idDoc), { [`permisos_history.${anio}`]: true });
                await batch.commit();
                
                alert("Permiso registrado correctamente."); 
                
                document.getElementById('permisoId').value = "";
                document.getElementById('tipoPermiso').value = "";
                document.getElementById('docenteSelect').value = "";
                toggleTimeInputs();

            } catch(e) { 
                console.error(e); alert("Error: " + e.message); 
            } finally { 
                btn.disabled = false; btn.innerHTML = "<i class='bx bx-save'></i> Registrar Permiso"; 
            }
        };

        // --- HISTORIAL AGRUPADO POR DOCENTE CON CÁLCULO DE SALDOS ---
        window.listarHistorialPermisos = async () => {
            const anio = document.getElementById('hist_anio').value;
            const container = document.getElementById('listaHistorial');
            const msg = document.getElementById('msgSinResultados');
            container.innerHTML = "<div class='empty-state'><i class='bx bx-loader bx-spin'></i> Cargando...</div>";
            msg.style.display = 'none';

            const filtrados = allDocentes.filter(d => d.permisos_history && d.permisos_history[anio]);

            if(filtrados.length === 0) { 
                container.innerHTML = ""; 
                msg.style.display = 'block'; 
                return; 
            }

            let html = "";
            globalCacheHistory = {}; // Limpiamos caché del historial

            for (const d of filtrados) {
                try {
                    const snap = await getDoc(doc(db, "docentes", d.id, "metadata", "permisos"));
                    if(snap.exists()){
                        const perms = Object.entries(snap.data()).filter(([k,v]) => v.fechaInicio && v.fechaInicio.startsWith(anio));
                        
                        if (perms.length > 0) {
                            globalCacheHistory[d.id] = perms;
                            
                            // 1. Calcular Saldos
                            let consumos = { personales: {d:0, h:0}, incapacidad: {d:0, h:0}, duelo: {d:0, h:0}, sinsueldo: {d:0, h:0}, maternidad: {d:0, h:0}, paternidad: {d:0, h:0}, otros: {d:0, h:0} };
                            
                            perms.forEach(([k, p]) => {
                                const cat = categorizarPermiso(p.tipo);
                                const cant = parseFloat(p.cantidadCalculada) || 0;
                                if(p.unidad === 'dias') {
                                    consumos[cat].d += cant;
                                } else {
                                    consumos[cat].h += cant;
                                }
                            });

                            const nombresCat = { personales: 'Personales', incapacidad: 'Incapacidad', duelo: 'Duelo', sinsueldo: 'Sin Sueldo', maternidad: 'Maternidad', paternidad: 'Paternidad' };
                            let resumenHtml = '';

                            Object.keys(LIMITES).forEach(cat => {
                                const diasConsumidos = consumos[cat].d;
                                const horasConsumidas = consumos[cat].h;
                                
                                if(diasConsumidos > 0 || horasConsumidas > 0) {
                                    const restanteDias = LIMITES[cat] - diasConsumidos;
                                    const txtHoras = horasConsumidas > 0 ? ` (Gastadas: ${horasConsumidas}h)` : '';
                                    
                                    // Determinar color de alerta si quedan pocos días
                                    let colorCls = 'color: var(--success); background: #f0fdf4; border-color: #bbf7d0;';
                                    if (restanteDias <= 1) colorCls = 'color: var(--danger); background: #fef2f2; border-color: #fecaca;';
                                    else if (restanteDias <= 2) colorCls = 'color: var(--warning); background: #fffbeb; border-color: #fde68a;';

                                    resumenHtml += `<div style="font-size: 0.65rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; border: 1px solid; display: inline-block; margin: 4px 4px 0 0; ${colorCls}">
                                        ${nombresCat[cat]}: Restan ${restanteDias} días ${txtHoras}
                                    </div>`;
                                }
                            });

                            if(resumenHtml === '') {
                                resumenHtml = `<div style="font-size: 0.7rem; color: var(--accent); font-style: italic; margin-top: 4px;">No ha consumido permisos limitados.</div>`;
                            }

                            // 2. Construir Tarjeta
                            html += `
                                <div class="hist-card" onclick="verDetallePermisos('${d.id}', '${encodeURIComponent(d.nombre || d.name)}')">
                                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                        <div>
                                            <h4>${d.nombre || d.name}</h4>
                                            <p style="text-transform: capitalize; font-size: 0.75rem; color: var(--accent); font-weight: 700; margin-bottom: 0.6rem;">Cargo: ${d.cargo || 'Docente'}</p>
                                        </div>
                                        <div class="time-badge" style="background: #e0f2fe; color: var(--primary-steel); padding: 0.3rem 0.6rem; border-radius: 6px; font-weight: 800; font-size: 0.75rem; display: inline-block;">
                                            ${perms.length} Permiso(s)
                                        </div>
                                    </div>
                                    <div style="margin-top: 0.2rem; padding-top: 0.8rem; border-top: 1px dashed var(--border); display: flex; flex-direction: column;">
                                        <span style="font-size:0.65rem; font-weight:800; color:var(--accent); text-transform:uppercase; display:block; margin-bottom:4px;"><i class='bx bx-pie-chart-alt-2'></i> Saldos Disponibles:</span>
                                        <div>${resumenHtml}</div>
                                    </div>
                                </div>
                            `;
                        }
                    }
                } catch(e) { console.error("Error leyendo permisos de", d.nombre, e); }
            }
            container.innerHTML = html || "<div class='empty-state'>Sin registros procesables.</div>";
        };

        // --- VER DETALLE MODAL ORDENADO POR FECHA INICIO ---
        window.verDetallePermisos = (id, nombreEncoded) => {
            const nombre = decodeURIComponent(nombreEncoded);
            const anio = document.getElementById('hist_anio').value;
            
            document.getElementById('modalHistTitle').innerText = nombre;
            document.getElementById('modalHistSubtitle').innerText = `Historial de Permisos — Año Lectivo: ${anio}`;
            
            const tbody = document.getElementById('modalHistBody');
            tbody.innerHTML = "";

            const registros = globalCacheHistory[id] || [];
            
            // ORDENACIÓN MATEMÁTICA CRONOLÓGICA (Por fechaInicio Ascendente)
            registros.sort((a, b) => new Date(a[1].fechaInicio) - new Date(b[1].fechaInicio));

            if(registros.length === 0) {
                tbody.innerHTML = "<div class='empty-state'>No hay registros detallados.</div>";
            } else {
                tbody.innerHTML = registros.map(([recId, p]) => {
                    const fIni = formatDateShortStr(p.fechaInicio);
                    const fFin = p.fechaFin ? formatDateShortStr(p.fechaFin) : '';
                    const strTiempo = p.unidad === 'dias' ? `Del ${fIni} al ${fFin}` : `${fIni} | ${p.horaInicio} - ${p.horaFin}`;

                    return `<div class="permiso-row">
                        <div class="permiso-top">
                            <div>
                                <strong>${p.idVisual || 'S/ID'} - ${p.tipo}</strong>
                                <span><i class='bx bx-calendar'></i> ${strTiempo}</span>
                            </div>
                            <div class="time-badge">${p.textoCalculado}</div>
                        </div>
                        <div class="permiso-checks">
                            <label class="check-label">
                                <input type="checkbox" ${p.enlibro ? 'checked' : ''} onchange="actualizarCheck('${id}', '${recId}', 'enlibro', this.checked)"> Libro
                            </label>
                            <label class="check-label">
                                <input type="checkbox" ${p.enficha ? 'checked' : ''} onchange="actualizarCheck('${id}', '${recId}', 'enficha', this.checked)"> Expediente
                            </label>
                        </div>
                    </div>`;
                }).join('');
            }

            document.getElementById('modalHistorial').classList.add('active');
        };

        window.actualizarCheck = async (idDocente, recId, campo, valor) => {
            try {
                await updateDoc(doc(db, "docentes", idDocente, "metadata", "permisos"), {
                    [`${recId}.${campo}`]: valor
                });
                if(globalCacheHistory[idDocente]) {
                    const found = globalCacheHistory[idDocente].find(([k,v]) => k === recId);
                    if(found) found[1][campo] = valor;
                }
            } catch (e) {
                console.error("Error guardando el check:", e);
                alert("No se pudo guardar la configuración.");
            }
        };

    </script>
</body>
</html>
