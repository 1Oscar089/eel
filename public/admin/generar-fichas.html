<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportar Expediente de Fichas - Iconic Edition</title>
    
    <link rel="preload" href="../css/styles.css" as="style">
    <link rel="stylesheet" href="../css/styles.css">
    
    <link href='https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        /* ESTILOS ESTRICTAMENTE ESPECÍFICOS PARA ESTA PÁGINA ENFOCADA */
        body { 
            background: var(--bg-light); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 1rem; 
        }
        
        .focused-window { 
            width: 100%; 
            max-width: 550px; 
            background: white; 
            padding: 2.5rem; 
            border-radius: var(--border-radius-xl); 
            border: 1px solid var(--border); 
            box-shadow: var(--shadow-lg); 
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .window-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 1.5rem; 
            border-bottom: 2px solid var(--bg-light); 
            padding-bottom: 1rem; 
        }
        .window-header h1 { 
            font-size: 1.3rem; 
            font-weight: 800; 
            color: var(--primary-dark);
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
            margin: 0;
        }
        .window-header h1 i { color: var(--primary-steel); font-size: 1.6rem; }
        
        .btn-back { 
            background: var(--bg-light); 
            color: var(--accent); 
            padding: 0.5rem 1rem; 
            border-radius: 8px; 
            font-weight: 800; 
            font-size: 0.85rem; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 0.4rem; 
            transition: 0.2s; 
            border: 1px solid transparent; 
        }
        .btn-back:hover { background: #f1f5f9; color: var(--danger); border-color: #fecaca; }

        .info-msg { 
            background: #e0f2fe; 
            color: var(--primary-steel); 
            font-size: 0.85rem; 
            font-weight: 700; 
            padding: 1rem; 
            border-radius: 8px; 
            border: 1px solid #bae6fd; 
            text-align: center; 
            margin-bottom: 1.5rem; 
            line-height: 1.4;
        }
        
        .search-container { position: relative; margin-bottom: 1rem; }
        .search-results { 
            position: absolute; 
            top: 100%; 
            left: 0; 
            width: 100%; 
            background: white; 
            border: 1px solid var(--border); 
            border-radius: 0 0 8px 8px; 
            max-height: 200px; 
            overflow-y: auto; 
            z-index: 100; 
            display: none; 
            box-shadow: var(--shadow-md); 
        }
        .result-item { 
            padding: 0.8rem 1rem; 
            cursor: pointer; 
            border-bottom: 1px solid var(--bg-light); 
            display: flex; 
            flex-direction: column; 
        }
        .result-item:hover { background: #f0f8ff; color: var(--primary-steel); }
        .result-item strong { font-size: 0.9rem; font-weight: 800; color: var(--primary-dark); }
        .result-item small { font-size: 0.75rem; color: var(--accent); font-weight: 700; margin-top: 0.2rem; }

        .btn-imprimir { 
            background: var(--primary-dark); 
            color: white; 
            padding: 1.1rem; 
            border-radius: 8px; 
            font-weight: 800; 
            font-size: 1rem; 
            cursor: pointer; 
            border: none; 
            width: 100%; 
            transition: 0.2s; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 0.5rem; 
            margin-top: 1.5rem; 
        }
        .btn-imprimir:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
        .btn-imprimir:hover:not(:disabled) { 
            background: var(--primary-steel); 
            transform: translateY(-2px); 
            box-shadow: 0 6px 15px rgba(82, 137, 173, 0.3); 
        }

        .loading-screen { 
            position: fixed; 
            inset: 0; 
            background: var(--bg-light); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 2000; 
            font-weight: 800; 
            color: var(--primary-steel); 
            font-size: 1.2rem; 
            gap: 1rem; 
        }

        @media (max-width: 768px) {
            .focused-window { padding: 1.5rem; }
            .window-header h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="loadingScreen" class="loading-screen">
        <i class='bx bx-loader-alt bx-spin' style="font-size: 3rem;"></i>
        Cargando plataforma...
    </div>

    <div id="mainContent" class="focused-window" style="display: none;">
        <div class="window-header">
            <h1><i class='bx bxs-file-pdf'></i> Exportar Fichas</h1>
            <a href="fichas.html" class="btn-back"><i class='bx bx-x'></i> Cancelar</a>
        </div>

        <div class="info-msg">
            Genera un PDF con el historial completo de las fichas anecdóticas y disciplinarias de un estudiante en el año seleccionado.
        </div>
        
        <div class="form-group">
            <label>Año Lectivo</label>
            <input type="number" id="export_anio">
        </div>

        <div class="search-container" style="z-index: 10;">
            <div class="form-group">
                <label>Buscar Estudiante</label>
                <input type="text" id="searchEstudiante" placeholder="Escriba apellido o nombre..." autocomplete="off">
            </div>
            <div id="resultsEstudiante" class="search-results"></div>
            <input type="hidden" id="selectedId">
        </div>

        <div class="form-group">
            <label>Estudiante Seleccionado</label>
            <input type="text" id="nombreEstudiante" readonly placeholder="Ninguno">
        </div>

        <button id="btnImprimir" class="btn-imprimir" onclick="generarReporteFichas()" disabled>
            <i class='bx bxs-download'></i> Descargar Expediente PDF
        </button>
    </div>

    <script type="module">
        import { auth, db } from '../js/initFirebase.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { collection, query, where, getDocs, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const { jsPDF } = window.jspdf;
        const LOGO_URL = "../img/logo_mined.png"; 

        const gradeLabels = { '10': 'Parvularia 4', '11': 'Parvularia 5', '12': 'Parvularia 6', '1': 'Primer Grado', '2': 'Segundo Grado', '3': 'Tercer Grado', '4': 'Cuarto Grado', '5': 'Quinto Grado', '6': 'Sexto Grado', '7': 'Séptimo Grado', '8': 'Octavo Grado', '9': 'Noveno Grado' };
        
        let allStudents = [];
        let esDirector = false;
        let misGradosIds = [];
        let escuelaData = { name: "Centro Educativo", code: "" };
        let currentStudentObj = null;

        // SISTEMA DE TOAST
        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class='bx ${type === 'success' ? 'bx-check-circle' : 'bx-error-circle'}'></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        };

        const normalizeStr = (str) => { return (str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); };
        const getKeys = (fn) => { const w = (fn || '').toLowerCase().split(/\s+/).filter(x => !['de','del','la','las','los','y'].includes(x)); return { a1: w[w.length-2]||w[0]||'', a2: w[w.length-1]||'', n1: w[0]||'' }; };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('export_anio').value = new Date().getFullYear();

            onAuthStateChanged(auth, async (user) => {
                if (!user) return window.location.href = '../index.html';
                
                try {
                    // Perfil del docente
                    const qUser = query(collection(db, "docentes"), where("correo", "==", user.email));
                    const snapUser = await getDocs(qUser);
                    if (!snapUser.empty) {
                        const userData = snapUser.docs[0].data();
                        if (userData.cargo && ['director', 'subdirector'].includes(userData.cargo.toLowerCase())) {
                            esDirector = true;
                        }
                        misGradosIds = (userData.grados || []).map(String);
                    }

                    // Datos de la escuela
                    const docEscuela = await getDoc(doc(db, "control", "escuela"));
                    if (docEscuela.exists()) escuelaData = docEscuela.data();

                    // Cargar estudiantes
                    onSnapshot(collection(db, "users"), (snap) => {
                        allStudents = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(s => s.nombreCompleto && !s.archivado);
                        document.getElementById('loadingScreen').style.display = 'none';
                        document.getElementById('mainContent').style.display = 'block';
                    });

                } catch (e) { console.error(e); }
            });
        });

        function getMisEstudiantes() {
            if (esDirector) return allStudents;
            return allStudents.filter(st => misGradosIds.includes(String(st.grade)));
        }

        // --- BUSCADOR ---
        function filtrarEstudiantes(term) {
            const container = document.getElementById('resultsEstudiante');
            const cleanTerm = term.trim();
            
            if (cleanTerm.length < 3) { 
                container.style.display = 'none'; 
                return; 
            }
            
            const misEstudiantes = getMisEstudiantes();
            const normalizedTerm = normalizeStr(cleanTerm);
            
            const filtered = misEstudiantes.filter(st => normalizeStr(st.nombreCompleto).includes(normalizedTerm));

            filtered.sort((a,b) => { 
                const kA = getKeys(a.nombreCompleto), kB = getKeys(b.nombreCompleto); 
                return kA.a1.localeCompare(kB.a1) || kA.a2.localeCompare(kB.a2) || kA.n1.localeCompare(kB.n1); 
            });

            container.innerHTML = filtered.map(st => {
                const nieText = (st.NIE || st.nie) ? `NIE: ${st.NIE || st.nie}` : '';
                return `
                <div class="result-item" onclick="seleccionarEstudiante('${st.id}')">
                    <strong>${st.nombreCompleto}</strong>
                    <small>${gradeLabels[st.grade] || 'Grado '+st.grade} ${nieText ? '| '+nieText : ''}</small>
                </div>
            `}).join('');
            
            container.style.display = filtered.length ? 'block' : 'none';
        }

        document.getElementById('searchEstudiante').addEventListener('input', (e) => filtrarEstudiantes(e.target.value));

        window.seleccionarEstudiante = (id) => {
            const st = allStudents.find(s => s.id === id);
            currentStudentObj = st;
            
            document.getElementById('selectedId').value = id;
            document.getElementById('nombreEstudiante').value = st.nombreCompleto;
            document.getElementById('searchEstudiante').value = '';
            document.getElementById('resultsEstudiante').style.display = 'none';
            document.getElementById('btnImprimir').disabled = false;
        };

        // --- DESCARGAR PDF ---
        window.generarReporteFichas = async () => {
            const anio = document.getElementById('export_anio').value;
            const id = document.getElementById('selectedId').value;
            const btn = document.getElementById('btnImprimir');

            if (!anio || !id || !currentStudentObj) {
                showToast("Seleccione un estudiante y un año válido.", "warning");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "<i class='bx bx-loader bx-spin'></i> Extrayendo expediente...";

            try {
                // Leer metadata de fichas del estudiante
                let registros = [];
                const docRef = await getDoc(doc(db, "users", id, "metadata", "fichas"));
                if (docRef.exists()) {
                    registros = Object.values(docRef.data()).filter(r => r.fecha?.startsWith(anio));
                }

                if (registros.length === 0) {
                    showToast(`El estudiante no tiene fichas registradas en el año ${anio}.`, "error");
                    btn.disabled = false;
                    btn.innerHTML = "<i class='bx bxs-download'></i> Descargar Expediente PDF";
                    return;
                }

                btn.innerHTML = "<i class='bx bx-loader bx-spin'></i> Dibujando PDF...";

                const docPdf = new jsPDF('p', 'mm', 'letter');
                const width = docPdf.internal.pageSize.getWidth();
                const nombreEscuela = escuelaData.name || escuelaData.nombre || "Centro Educativo";

                try { 
                    const response = await fetch(LOGO_URL); const blob = await response.blob();
                    const logoData = await new Promise((res) => { const r = new FileReader(); r.onloadend = () => res(r.result); r.readAsDataURL(blob); });
                    docPdf.addImage(logoData, 'PNG', width - 40, 10, 30, 12); 
                } catch(e){}

                // Encabezado
                docPdf.setFont("helvetica", "bold");
                docPdf.setFontSize(14);
                docPdf.text(nombreEscuela, 14, 15);
                docPdf.setFontSize(12);
                docPdf.text("Expediente Conductual y Anecdótico", 14, 22);
                
                // Datos del Alumno
                docPdf.setFontSize(10);
                docPdf.setFont("helvetica", "normal");
                docPdf.text(`Estudiante: ${currentStudentObj.nombreCompleto}`, 14, 32);
                docPdf.text(`NIE: ${currentStudentObj.NIE || currentStudentObj.nie || 'N/D'}`, 14, 38);
                docPdf.text(`Grado: ${gradeLabels[currentStudentObj.grade] || currentStudentObj.grade}`, 14, 44);
                docPdf.text(`Año Lectivo: ${anio}`, 14, 50);

                docPdf.setDrawColor(200, 200, 200);
                docPdf.line(14, 54, width - 14, 54);

                // Preparar datos tabla
                let tableData = [];
                registros.sort((a,b) => new Date(a.fecha) - new Date(b.fecha)).forEach((h) => {
                    const txtCausalCompleto = h.causal + (h.descripcion ? `\n\nDetalles: ${h.descripcion}` : '');
                    
                    // Formatear Fecha visualmente sin romper la data original
                    let fechaVisual = h.fecha;
                    if(fechaVisual && fechaVisual.includes('-')) {
                        const [y, m, d] = fechaVisual.split('-');
                        fechaVisual = `${d}/${m}/${y}`;
                    }

                    tableData.push([
                        fechaVisual,
                        h.tipo,
                        txtCausalCompleto,
                        h.accion,
                        h.registradoPor || 'N/D'
                    ]);
                });

                docPdf.autoTable({
                    startY: 58,
                    head: [['Fecha', 'Tipo', 'Causal y Hechos Reportados', 'Medida Aplicada', 'Docente']],
                    body: tableData,
                    theme: 'grid',
                    styles: { fontSize: 8, cellPadding: 2, valign: 'middle' },
                    headStyles: { fillColor: [36, 60, 76], textColor: 255 },
                    columnStyles: { 
                        0: { cellWidth: 20 }, 
                        1: { cellWidth: 25 }, 
                        2: { cellWidth: 'auto' }, 
                        3: { cellWidth: 40 },
                        4: { cellWidth: 25 }
                    }
                });

                // Guardar PDF
                const nombreArchivo = `Expediente_Fichas_${currentStudentObj.nombreCompleto.replace(/\s+/g, '_')}_${anio}.pdf`;
                docPdf.save(nombreArchivo);

                showToast("Expediente generado y descargado.", "success");

                setTimeout(() => {
                    window.location.href = 'fichas.html';
                }, 2000);

            } catch (error) {
                console.error("Error al exportar: ", error);
                showToast("Hubo un error al generar el documento.", "error");
                btn.disabled = false;
                btn.innerHTML = "<i class='bx bxs-download'></i> Descargar Expediente PDF";
            }
        };
    </script>
</body>
</html>
