<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudiantes - Iconic Edition</title>
    
    <link rel="preload" href="../css/userbar.css" as="style">
    <link rel="preload" href="../css/admin-sidebar.css" as="style">
    <link rel="stylesheet" href="../css/userbar.css">
    <link rel="stylesheet" href="../css/admin-sidebar.css">
    
    <link href='https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <style>
        :root { 
            --primary-dark: #243C4C; --primary-steel: #5289AD; 
            --accent: #698696; --border: #ACBCBF; 
            --bg-light: #F4FCFB; --danger: #ef4444; --warning: #f59e0b; --success: #16a34a; --info: #3b82f6;
            --gap: 0.5rem;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif !important; }
        
        /* BLOQUEO DE DESBORDAMIENTO Y AJUSTE EXACTO DE MÁRGENES (0.5rem) */
        html, body { background: var(--bg-light); color: var(--primary-dark); width: 100vw !important; max-width: 100vw !important; overflow: hidden !important; position: relative; }
        
        .admin-main { 
            height: calc(100vh - 60px) !important; 
            width: calc(100vw - 260px) !important; 
            margin-left: 260px !important; 
            margin-top: 0 !important; 
            padding: var(--gap) !important; 
            overflow-y: auto !important; 
            overflow-x: hidden !important; 
            display: flex;
            flex-direction: column;
            -ms-overflow-style: none; 
            scrollbar-width: none; 
        }
        .admin-main::-webkit-scrollbar { display: none; }

        @media (max-width: 1024px) {
            .admin-main { width: 100vw !important; margin-left: 0 !important; padding-bottom: 80px !important; padding: var(--gap) !important; }
        }
        
        /* HEADER Y BUSCADOR */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--gap); flex-shrink: 0; }
        .page-header h1 { font-size: 1.4rem; font-weight: 800; color: var(--primary-dark); letter-spacing: -1px; }

        .btn-registrar { background: var(--primary-dark); color: white; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; border: none; transition: 0.2s; display: flex; align-items: center; gap: 0.4rem; }
        .btn-registrar:hover { background: var(--primary-steel); }

        /* FIX: Evita que el contenedor se estire en el Flexbox */
        .search-container { 
            background: white; 
            padding: 0.5rem 0.8rem; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            margin-bottom: 1rem; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
            flex: 0 0 auto; /* No crecer, no encoger, automático */
            height: fit-content; /* Altura ajustada a su contenido */
        }
        .search-container input { border: none; outline: none; width: 100%; font-size: 0.9rem; color: var(--primary-dark); font-weight: 500; background: transparent; }
        .search-container input::placeholder { color: var(--accent); }

        /* TABLAS Y LISTADOS */
        .grade-group { margin-bottom: 1.5rem; flex-shrink: 0; }
        .grade-title { font-size: 0.95rem; font-weight: 800; color: var(--primary-dark); text-transform: uppercase; margin-bottom: 0.5rem; }

        .list-table { width: 100%; background: white; border: 1px solid var(--border); border-radius: 8px; border-collapse: collapse; table-layout: auto; }
        .list-table th, .list-table td { padding: 0.5rem 0.8rem; text-align: left; border-bottom: 1px solid var(--border); }
        .list-table th { font-size: 0.65rem; font-weight: 800; color: var(--accent); text-transform: uppercase; background: #f8fafc; }
        .list-table td { font-size: 0.85rem; color: var(--primary-dark); }
        
        .col-empty { color: var(--accent); font-weight: 500; font-style: italic; }

        /* Anchos de columnas en Desktop */
        .col-estudiante { width: 35%; }
        .col-nie { width: 15%; }
        .col-resp { width: 30%; }
        .col-dui { width: 10%; }
        .col-tel { width: 10%; }
        .col-accion { width: 5%; text-align: center; }

        .btn-view { background: #e0f2fe; color: var(--info); border: none; border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; transition: 0.2s; margin: 0 auto; }
        .btn-view:hover { background: #bae6fd; transform: scale(1.05); }

        /* MODAL BLINDADO */
        .modal-overlay { position: fixed; inset: 0; background: rgba(36, 60, 76, 0.6); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 0.5rem; backdrop-filter: blur(2px); }
        .modal-overlay.active { display: flex; }
        
        .modal {
            background: white; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 650px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex !important;
            flex-direction: column !important;
            max-height: 90vh !important; 
            overflow: hidden !important; 
            padding: 1.8rem;
        }
        
        .modal-header { flex-shrink: 0 !important; margin-bottom: 1.2rem; }
        
        .modal-body {
            flex: 1 1 auto !important; 
            min-height: 0 !important; 
            overflow-y: auto !important; 
            padding-right: 0.5rem !important;
            margin-bottom: 0.5rem !important;
        }
        
        .modal-actions {
            flex-shrink: 0 !important; 
            background: white !important;
            padding-top: 1rem !important;
            border-top: 1px solid var(--bg-light);
            margin-top: 0 !important;
            position: relative !important;
            z-index: 10 !important;
            display: flex; 
            gap: 0.5rem; 
            justify-content: space-between; 
            align-items: center;
        }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .form-group.full-width { grid-column: 1 / -1; }
        
        .form-group label { font-size: 0.65rem; font-weight: 800; color: var(--primary-steel); text-transform: uppercase; display: flex; align-items: center; gap: 0.4rem;}
        .form-group input, .form-group select { padding: 0.7rem; border-radius: 6px; border: 1px solid var(--border); font-size: 0.95rem; font-weight: 700; color: var(--primary-dark); background: white; outline: none; transition: 0.2s; width: 100%; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary-steel); }
        .form-group input:disabled, .form-group select:disabled { background: #f8fafc; color: #475569; border-color: #cbd5e1; cursor: default; }

        /* AUTOCOMPLETADO */
        .autocomplete-wrapper { position: relative; width: 100%; }
        .suggestions-box { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--primary-steel); border-top: none; border-radius: 0 0 8px 8px; max-height: 180px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .suggestion-item { padding: 0.7rem 0.8rem; font-size: 0.85rem; font-weight: 700; color: var(--primary-dark); cursor: pointer; border-bottom: 1px solid var(--bg-light); display: flex; flex-direction: column; }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: #f0f8ff; color: var(--primary-steel); }
        .sugg-meta { font-size: 0.65rem; color: var(--accent); font-weight: 500; margin-top: 0.2rem; }

        .btn-eye { background: #f0f4f8; border: 1px solid var(--border); border-radius: 4px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--primary-steel); font-size: 1.1rem; }
        .btn-eye:hover { background: var(--primary-steel); color: white; border-color: var(--primary-steel); }
        #edadSpan { font-size: 0.75rem; color: var(--primary-steel); font-weight: 800; display: none; margin-left: 0.2rem; }

        .btn-sq { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; border: none; transition: 0.2s; }
        .btn-sq-delete { background: #fef2f2; color: var(--danger); display: none; }
        .btn-sq-delete:hover { background: #fee2e2; }
        .btn-sq-archive { background: #fef3c7; color: var(--warning); display: none; }
        .btn-sq-archive:hover { background: #fde68a; }
        .btn-sq-edit { background: #eff6ff; color: var(--info); display: none; }
        .btn-sq-edit:hover { background: #dbeafe; }
        
        .btn-save-text { 
            background: var(--primary-dark); 
            color: white; 
            padding: 0.6rem 1.2rem; 
            border-radius: 8px; 
            font-weight: 800; 
            font-size: 0.85rem; 
            border: none; 
            cursor: pointer; 
            display: none; 
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .btn-save-text:hover { background: var(--primary-steel); }

        .empty-state { text-align: center; padding: 2rem; color: var(--accent); font-style: italic; font-size: 0.85rem;}

        /* AJUSTES RESPONSIVOS PARA MÓVILES */
        @media (max-width: 768px) {
            .desktop-only { display: none !important; }
            
            .list-table { table-layout: fixed; width: 100%; }
            .col-estudiante { width: 55%; }
            .col-nie { width: 25%; }
            .col-accion { width: 20%; }
            
            .list-table th, .list-table td { padding: 0.4rem 0.2rem; word-wrap: break-word; }
            .list-table th { font-size: 0.55rem; }
            .list-table td { font-size: 0.7rem; }
            .list-table td strong { font-size: 0.75rem; }
            
            .btn-view { width: 26px; height: 26px; font-size: 1rem; }
            
            .modal { padding: 1.2rem; width: 95%; }
            .form-grid { grid-template-columns: 1fr; gap: 0.6rem; margin-bottom: 0; }
            .form-group.full-width { grid-column: span 1; }
            .form-group input, .form-group select { padding: 0.6rem; font-size: 0.85rem; }
            
            .modal-actions { justify-content: space-between; padding-top: 0.8rem; }
            .btn-sq { width: 34px; height: 34px; font-size: 1.1rem; }
            
            .btn-save-text { font-size: 0.8rem; padding: 0.6rem 1rem; }
        }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    <div id="userbar-root"></div>
    <div class="admin-layout">
        <div id="admin-sidebar-root"></div>
        <main class="admin-main">
            
            <div class="page-header">
                <h1>Estudiantes</h1>
                <button id="btnRegistrar" class="btn-registrar" style="display: none;" onclick="abrirModal()">
                    <i class='bx bx-plus'></i> Registrar
                </button>
            </div>

            <div class="search-container">
                <i class='bx bx-search'></i>
                <input type="text" id="searchInput" placeholder="Mínimo 3 letras para buscar por nombre o NIE..." oninput="filtrarEstudiantes()">
            </div>

            <div id="listaEstudiantes">
                <div class="empty-state">
                    <i class='bx bx-loader bx-spin'></i> 
                    <p>Sincronizando base de datos...</p>
                </div>
            </div>

        </main>
    </div>

    <div class="modal-overlay" id="modalEstudiante">
        <div class="modal" onclick="cerrarSugerenciasExternas(event)">
            
            <div class="modal-header">
                <h2 id="modalTitle" style="font-size: 1.2rem; font-weight: 800; color: var(--primary-dark); margin: 0;"><i class='bx bx-id-card'></i> Expediente del Estudiante</h2>
            </div>
            
            <form id="formEstudiante" style="display: flex; flex-direction: column; height: 100%; min-height: 0;">
                <div class="modal-body">
                    <input type="hidden" id="estId">
                    
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>Nombre Completo del Estudiante *</label>
                            <input type="text" id="estNombre" class="ctrl-input" required autocomplete="off">
                        </div>

                        <div class="form-group">
                            <label>NIE *</label>
                            <input type="text" id="estNie" class="ctrl-input" required placeholder="Solo números" maxlength="15">
                        </div>
                        <div class="form-group">
                            <label>Grado Asignado *</label>
                            <select id="estGrado" class="ctrl-input" required>
                                <option value="" disabled selected>Seleccionar grado...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 0.4rem;">
                                Nacimiento *
                                <button type="button" class="btn-eye" onclick="calcularEdad()" title="Calcular Edad"><i class='bx bx-show'></i></button>
                                <span id="edadSpan"></span>
                            </label>
                            <input type="date" id="estNacimiento" class="ctrl-input" required>
                        </div>
                        <div class="form-group">
                            <label>Sexo *</label>
                            <select id="estSexo" class="ctrl-input" required>
                                <option value="" disabled selected>Seleccionar...</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Femenino">Femenino</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label>Nombre del Responsable *</label>
                            <div class="autocomplete-wrapper">
                                <input type="text" id="estResponsable" class="ctrl-input" required autocomplete="off" oninput="buscarResponsable()">
                                <div id="respSuggestions" class="suggestions-box"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>DUI Resp.</label>
                            <input type="text" id="estDui" class="ctrl-input" placeholder="00000000-0" maxlength="10">
                        </div>
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" id="estTel" class="ctrl-input" placeholder="0000-0000" maxlength="9">
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <div style="display: flex; gap: 0.5rem;">
                        <button type="button" id="btnBorrar" class="btn-sq btn-sq-delete" onclick="borrarEstudiante()" title="Borrar Definitivamente" style="display: none;"><i class='bx bx-trash'></i></button>
                        <button type="button" id="btnArchivar" class="btn-sq btn-sq-archive" onclick="archivarEstudiante()" title="Archivar" style="display: none;"><i class='bx bx-archive-in'></i></button>
                        <button type="button" id="btnEditar" class="btn-sq btn-sq-edit" onclick="habilitarEdicion()" title="Editar Datos" style="display: none;"><i class='bx bx-edit-alt'></i></button>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button type="button" class="btn-save-text" style="background:var(--bg-light); color:var(--primary-dark); border:1px solid var(--border); display: flex;" onclick="cerrarModal()">Cancelar</button>
                        <button type="submit" id="btnGuardar" class="btn-save-text" style="display: flex;"><i class='bx bx-save'></i> Guardar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initUserbar } from '../js/userbar.js';
        import { initAdminSidebar } from '../js/admin-sidebar.js';
        import { auth, db } from '../js/initFirebase.js'; 
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { collection, query, where, onSnapshot, doc, setDoc, addDoc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        await initUserbar({ brandHref: '../index.html' }); 
        await initAdminSidebar();

        let allStudents = [];
        let allGrades = {};
        let userRole = 'docente'; 
        let misGrados = []; 

        // --- SISTEMA DE TOAST ---
        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class='bx ${type === 'success' ? 'bx-check-circle' : 'bx-error-circle'}'></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        };

        const limpiarTextoInput = (str) => {
            return str.toUpperCase()
                      .replace(/[ÁÀÄÂ]/g, 'A')
                      .replace(/[ÉÈËÊ]/g, 'E')
                      .replace(/[ÍÌÏÎ]/g, 'I')
                      .replace(/[ÓÒÖÔ]/g, 'O')
                      .replace(/[ÚÙÜÛ]/g, 'U')
                      .replace(/\s{2,}/g, ' ')
                      .trimStart();
        };

        const mascaraDui = (val) => { let v = val.replace(/\D/g, '').substring(0, 9); if (v.length > 8) v = v.replace(/^(\d{8})(\d)/, '$1-$2'); return v; };
        const mascaraTel = (val) => { let v = val.replace(/\D/g, '').substring(0, 8); if (v.length > 4) v = v.replace(/^(\d{4})(\d)/, '$1-$2'); return v; };

        document.getElementById('estNombre').addEventListener('input', (e) => e.target.value = limpiarTextoInput(e.target.value));
        document.getElementById('estResponsable').addEventListener('input', (e) => e.target.value = limpiarTextoInput(e.target.value));
        document.getElementById('estDui').addEventListener('input', (e) => e.target.value = mascaraDui(e.target.value));
        document.getElementById('estTel').addEventListener('input', (e) => e.target.value = mascaraTel(e.target.value));
        document.getElementById('estNie').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, ''); });

        window.calcularEdad = () => {
            const fechaVal = document.getElementById('estNacimiento').value;
            const span = document.getElementById('edadSpan');
            if(!fechaVal) { showToast("Ingresa la fecha de nacimiento primero.", "error"); return; }
            const birthDate = new Date(fechaVal);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
            span.innerText = `( ${age} años )`;
            span.style.display = 'inline-block';
        };

        const getApellidos = (nombre) => {
            if(!nombre) return "";
            const partes = nombre.trim().split(/\s+/);
            if(partes.length < 2) return nombre.toUpperCase();
            return `${partes[partes.length-2]} ${partes[partes.length-1]}`.toUpperCase();
        };

        // AUTOCOMPLETADO
        window.buscarResponsable = () => {
            const inputElement = document.getElementById('estResponsable');
            const queryText = inputElement.value;
            const box = document.getElementById('respSuggestions');
            
            if (queryText.length < 3) { box.style.display = 'none'; return; }

            const matches = []; const seen = new Set();
            allStudents.forEach(s => {
                if (s.responsable && s.responsable.toUpperCase().includes(queryText.toUpperCase())) {
                    if (!seen.has(s.responsable)) {
                        seen.add(s.responsable);
                        matches.push({ nombre: s.responsable, dui: s.dui || '', tel: s.tel || '' });
                    }
                }
            });

            if (matches.length > 0) {
                box.innerHTML = matches.map(m => `
                    <div class="suggestion-item" onclick="seleccionarResponsable('${m.nombre}', '${m.dui}', '${m.tel}')">
                        ${m.nombre} 
                        <span class="sugg-meta">DUI: ${m.dui || 'No registrado'} | TEL: ${m.tel || 'No registrado'}</span>
                    </div>
                `).join('');
                box.style.display = 'block';
            } else { box.style.display = 'none'; }
        };

        window.seleccionarResponsable = (nombre, dui, tel) => {
            document.getElementById('estResponsable').value = nombre;
            if (dui) document.getElementById('estDui').value = dui;
            if (tel) document.getElementById('estTel').value = tel;
            document.getElementById('respSuggestions').style.display = 'none';
        };

        window.cerrarSugerenciasExternas = (e) => {
            if (!e.target.closest('.autocomplete-wrapper')) {
                document.getElementById('respSuggestions').style.display = 'none';
            }
        };

        const normalizarFiltro = (val) => {
            if (typeof val === 'object' && val !== null) val = val.id || val.nombre || val.value || "";
            let s = String(val).toUpperCase()
                      .replace(/[ÁÀÄÂ]/g, 'A')
                      .replace(/[ÉÈËÊ]/g, 'E')
                      .replace(/[ÍÌÏÎ]/g, 'I')
                      .replace(/[ÓÒÖÔ]/g, 'O')
                      .replace(/[ÚÙÜÛ]/g, 'U');
            return s.toLowerCase().trim();
        };

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = '../index.html'; return; }
            
            onSnapshot(query(collection(db, 'docentes'), where('correo', '==', user.email)), (snap) => {
                if(!snap.empty) {
                    const docData = snap.docs[0].data();
                    userRole = (docData.cargo || 'docente').toLowerCase();
                    
                    if (userRole !== 'director' && userRole !== 'subdirector') {
                        let rawGrados = docData.gradosAsignados || docData.grados || [];
                        if (typeof rawGrados === 'string') rawGrados = rawGrados.split(',');
                        misGrados = rawGrados.map(normalizarFiltro);
                    }
                    
                    // Ahora TODOS los perfiles que accedan verán el botón de Registrar
                    document.getElementById('btnRegistrar').style.display = 'flex';
                    
                    filtrarEstudiantes(); 
                }
            });
            
            onSnapshot(doc(db, "control", "grados"), (snap) => {
                if(snap.exists()) {
                    allGrades = snap.data();
                    const select = document.getElementById('estGrado');
                    const sortedIds = Object.keys(allGrades).sort((a,b) => parseInt(a) - parseInt(b));
                    select.innerHTML = '<option value="" disabled selected>Seleccionar grado...</option>' + 
                        sortedIds.map(id => `<option value="${id}">${allGrades[id].nombre || `Grado ${id}`}</option>`).join('');
                }
            });

            onSnapshot(collection(db, "users"), (snap) => {
                allStudents = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(s => !s.archivado);
                filtrarEstudiantes(); 
            });
        });

        window.filtrarEstudiantes = () => {
            const queryText = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('listaEstudiantes');

            let estudiantesPermitidos = allStudents;
            if (userRole !== 'director' && userRole !== 'subdirector') {
                estudiantesPermitidos = allStudents.filter(s => {
                    const gId = normalizarFiltro(s.grade);
                    const gName = normalizarFiltro(allGrades[s.grade]?.nombre || "");
                    return misGrados.includes(gId) || misGrados.includes(gName);
                });
            }

            let filtered = estudiantesPermitidos;
            if (queryText.length > 0) {
                if (queryText.length < 3) return; // Esperar a tener 3 letras
                filtered = estudiantesPermitidos.filter(s => 
                    (s.nombreCompleto || "").toLowerCase().includes(queryText) || 
                    (s.responsable || "").toLowerCase().includes(queryText) ||
                    (s.nie || s.NIE || "").includes(queryText)
                );
            }

            if(filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class='bx bx-user-x' style="font-size: 2rem; color: var(--border);"></i>
                        <p>No se encontraron estudiantes en su jurisdicción.</p>
                    </div>`;
                return;
            }

            const agrupados = {};
            filtered.forEach(s => {
                const gId = s.grade || '0';
                if(!agrupados[gId]) agrupados[gId] = [];
                agrupados[gId].push(s);
            });

            const gradosOrdenados = Object.keys(agrupados).sort((a,b) => parseInt(a) - parseInt(b));
            let html = '';

            gradosOrdenados.forEach(gId => {
                const nombreGrado = allGrades[gId]?.nombre || allGrades[gId] || "SIN GRADO ASIGNADO";
                agrupados[gId].sort((a, b) => getApellidos(a.nombreCompleto).localeCompare(getApellidos(b.nombreCompleto)));

                html += `
                    <div class="grade-group">
                        <h2 class="grade-title"><i class='bx bxs-graduation' style="color: var(--primary-steel);"></i> ${nombreGrado}</h2>
                        <div class="table-container">
                            <table class="list-table">
                                <thead>
                                    <tr>
                                        <th class="col-estudiante">ESTUDIANTE</th>
                                        <th class="col-nie">NIE</th>
                                        <th class="desktop-only col-resp">RESPONSABLE</th>
                                        <th class="desktop-only col-dui">DUI</th>
                                        <th class="desktop-only col-tel">TELÉFONO</th>
                                        <th class="col-accion" style="text-align: center;">ACCIÓN</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                agrupados[gId].forEach(s => {
                    const jsonEncoded = encodeURIComponent(JSON.stringify(s));
                    const nieValue = s.nie || s.NIE || '---';
                    html += `
                        <tr>
                            <td><strong>${s.nombreCompleto || '---'}</strong></td>
                            <td class="${(s.nie || s.NIE) ? '' : 'col-empty'}">${nieValue}</td>
                            <td class="desktop-only">${s.responsable || '---'}</td>
                            <td class="desktop-only ${(s.dui ? '' : 'col-empty')}">${s.dui || '---'}</td>
                            <td class="desktop-only ${(s.tel ? '' : 'col-empty')}">${s.tel || '---'}</td>
                            <td style="text-align: center;">
                                <button class="btn-view" onclick="abrirVisor('${jsonEncoded}')" title="Ver Expediente">
                                    <i class='bx bx-show'></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div></div>`; 
            });

            container.innerHTML = html;
        };

        window.borrarEstudiante = async () => {
            const id = document.getElementById('estId').value;
            if(!id || userRole !== 'director') return;
            if(!confirm(`¡PELIGRO EXTREMO!\n¿Deseas eliminar definitivamente este expediente y TODO su historial de notas y conducta?`)) return;

            try {
                const batch = writeBatch(db);
                const subDocs = await getDocs(collection(db, "users", id, "metadata"));
                subDocs.forEach(subDoc => batch.delete(doc(db, `users/${id}/metadata`, subDoc.id)));
                batch.delete(doc(db, "users", id));
                await batch.commit();
                
                cerrarModal();
                showToast("Expediente eliminado definitivamente de la base de datos.");
            } catch (e) { showToast("Error al eliminar los datos.", "error"); }
        };

        window.archivarEstudiante = async () => {
            const id = document.getElementById('estId').value;
            if(!id || userRole !== 'director') return;
            if(!confirm(`¿Deseas archivar al estudiante? Dejará de aparecer en las listas activas.`)) return;
            try {
                await setDoc(doc(db, "users", id), { archivado: true, updatedAt: Date.now() }, { merge: true });
                cerrarModal();
                showToast("Estudiante archivado correctamente.");
            } catch (e) { showToast("Error al archivar.", "error"); }
        };

        const alternarCampos = (deshabilitar) => { document.querySelectorAll('.ctrl-input').forEach(input => input.disabled = deshabilitar); };

        window.abrirModal = () => {
            document.getElementById('formEstudiante').reset();
            document.getElementById('estId').value = "";
            document.getElementById('edadSpan').style.display = 'none';
            document.getElementById('respSuggestions').style.display = 'none';
            
            alternarCampos(false); 
            
            document.getElementById('btnBorrar').style.display = 'none';
            document.getElementById('btnArchivar').style.display = 'none';
            document.getElementById('btnEditar').style.display = 'none';
            
            document.getElementById('btnGuardar').style.display = 'flex'; 
            
            document.getElementById('modalEstudiante').classList.add('active');
        };

        window.abrirVisor = (jsonEncoded) => {
            const s = JSON.parse(decodeURIComponent(jsonEncoded));
            document.getElementById('estId').value = s.id;
            document.getElementById('estNombre').value = s.nombreCompleto || '';
            document.getElementById('estNie').value = s.nie || s.NIE || '';
            document.getElementById('estGrado').value = s.grade || '';
            document.getElementById('estNacimiento').value = s.nacimiento || '';
            document.getElementById('estSexo').value = s.sexo || '';
            document.getElementById('estResponsable').value = s.responsable || '';
            document.getElementById('estDui').value = s.dui || '';
            document.getElementById('estTel').value = s.tel || '';
            
            document.getElementById('edadSpan').style.display = 'none';
            document.getElementById('respSuggestions').style.display = 'none';
            
            alternarCampos(true);
            document.getElementById('btnGuardar').style.display = 'none';
            
            if (userRole === 'director') {
                document.getElementById('btnBorrar').style.display = 'flex';
                document.getElementById('btnArchivar').style.display = 'flex';
                document.getElementById('btnEditar').style.display = 'flex';
            } else {
                document.getElementById('btnBorrar').style.display = 'none';
                document.getElementById('btnArchivar').style.display = 'none';
                document.getElementById('btnEditar').style.display = 'none';
            }
            
            document.getElementById('modalEstudiante').classList.add('active');
        };

        window.habilitarEdicion = () => {
            if(userRole !== 'director') return;
            alternarCampos(false); 
            
            // Bloqueamos el NIE para que no corrompa el ID de usuario
            document.getElementById('estNie').disabled = true;
            
            document.getElementById('btnEditar').style.display = 'none';
            document.getElementById('btnGuardar').style.display = 'flex';
            showToast("Edición habilitada. El NIE no puede ser modificado.", "info");
        };

        window.cerrarModal = () => document.getElementById('modalEstudiante').classList.remove('active');

        document.getElementById('formEstudiante').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('estId').value;
            
            if (id && userRole !== 'director') {
                showToast("No tienes permisos para modificar este expediente.", "error");
                return;
            }
            
            const nombreEstudiante = document.getElementById('estNombre').value.trim();
            const nombreResponsable = document.getElementById('estResponsable').value.trim();
            const gradoEstudiante = document.getElementById('estGrado').value;
            const nieEstudiante = document.getElementById('estNie').value.trim();
            const fechaNac = document.getElementById('estNacimiento').value;

            const correoEstudiante = `${nieEstudiante}@clases.edu.sv`;

            // GENERACIÓN DE ID INTELIGENTE
            const iniciales = nombreEstudiante.split(/\s+/).map(p => p[0]).join('').toUpperCase();
            const baseId = `${gradoEstudiante}${iniciales}`;
            let finalId = baseId;

            if (!id) {
                // Validar que el nombre exacto o el NIE no existan ya
                const existeNombre = allStudents.some(s => s.nombreCompleto.toUpperCase() === nombreEstudiante.toUpperCase());
                const existeNie = allStudents.some(s => (s.nie === nieEstudiante || s.NIE === nieEstudiante));

                if (existeNombre) {
                    showToast(`El estudiante "${nombreEstudiante}" ya se encuentra registrado en el sistema.`, "warning");
                    return;
                }
                if (existeNie && nieEstudiante !== "") {
                    showToast(`El NIE ${nieEstudiante} ya pertenece a otro estudiante.`, "warning");
                    return;
                }

                // Generar sufijo numérico si el ID base ya está ocupado
                let counter = 1;
                while (allStudents.some(s => s.id === finalId)) {
                    finalId = `${baseId}${counter}`;
                    counter++;
                }
            }

            const data = {
                nombreCompleto: nombreEstudiante,
                nie: nieEstudiante,
                grade: gradoEstudiante,
                nacimiento: fechaNac,
                sexo: document.getElementById('estSexo').value,
                responsable: nombreResponsable,
                dui: document.getElementById('estDui').value,
                tel: document.getElementById('estTel').value,
                archivado: false,
                email: correoEstudiante, 
                correo: correoEstudiante,
                updatedAt: Date.now()
            };

            const btn = document.getElementById('btnGuardar');
            const textOrig = btn.innerHTML;
            btn.innerHTML = "<i class='bx bx-loader bx-spin'></i> Guardando...";
            btn.disabled = true;

            try {
                if(id) {
                    // EDICIÓN
                    await setDoc(doc(db, "users", id), data, { merge: true });
                    showToast("Expediente actualizado con éxito.", "success");
                    cerrarModal();
                } else {
                    // REGISTRO NUEVO DIRECTO EN FIRESTORE CON ID INTELIGENTE
                    data.createdAt = Date.now();
                    await setDoc(doc(db, "users", finalId), data);
                    showToast("Estudiante registrado exitosamente.", "success");
                    cerrarModal();
                }
            } catch (error) { 
                console.error(error);
                showToast("Error de conexión con la base de datos.", "error"); 
            } finally {
                btn.innerHTML = textOrig;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
