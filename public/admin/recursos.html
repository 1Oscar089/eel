<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos - Iconic Edition</title>
    <link rel="preload" href="../css/userbar.css" as="style"><link rel="preload" href="../css/admin-sidebar.css" as="style">
    <link rel="stylesheet" href="../css/userbar.css"><link rel="stylesheet" href="../css/admin-sidebar.css">
    <style>
        :root { --primary-dark:#243C4C; --primary-steel:#5289AD; --accent:#698696; --border:#ACBCBF; --bg-light:#F4FCFB; --gap:0.5rem; --danger:#dc2626; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif !important; }
        
        html, body { background: var(--bg-light); color: var(--primary-dark); width: 100vw !important; max-width: 100vw !important; overflow-x: hidden !important; overflow-y: hidden; position: relative; }
        .admin-main { height: calc(100vh - 60px); width: 100% !important; overflow-y: auto; overflow-x: hidden !important; -ms-overflow-style: none; scrollbar-width: none; padding: var(--gap); }
        .admin-main::-webkit-scrollbar { display: none; }
        
        .page-header { margin-bottom: var(--gap); display: flex; justify-content: space-between; align-items: center; }
        .page-header h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -1px; }

        .table-card { background: white; border-radius: 12px; border: 1px solid var(--border); width: 100%; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; table-layout: auto; }
        thead th { background: var(--bg-light); padding: 0.6rem 0.5rem; font-size: 0.65rem; font-weight: 800; color: var(--accent); text-align: left; border-bottom: 1px solid var(--border); text-transform: uppercase; }
        tbody td { padding: 0.5rem 0.5rem; font-size: 0.85rem; border-bottom: 1px solid var(--bg-light); vertical-align: middle; }
        
        .res-item { display: flex; align-items: center; gap: 0.6rem; }
        .res-icon { width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .res-icon svg { width: 18px; height: 18px; }

        .color-preview { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }

        /* ACCIONES ICONOGRÁFICAS DIRECTAS */
        .actions-cell { display: flex; gap: 0.4rem; justify-content: flex-end; align-items: center; }
        .btn-action { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .btn-action svg { width: 18px; height: 18px; stroke-width: 2.2; }
        .action-edit { background: #eff6ff; color: #3b82f6; }
        .action-delete { background: #fef2f2; color: #ef4444; }

        .btn-primary { background: var(--primary-dark); color: white; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; border: none; }

        /* Modal Formulario */
        .modal-overlay { position: fixed; inset: 0; background: rgba(36, 60, 76, 0.5); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 0.5rem; backdrop-filter: blur(2px); }
        .modal-overlay.active { display: flex; }
        .modal { background: white; padding: 1.2rem; border-radius: 14px; width: 100%; max-width: 400px; }
        
        .form-group { display: flex; flex-direction: column; gap: 0.2rem; margin-bottom: 0.8rem; }
        .form-group label { font-size: 0.6rem; font-weight: 800; color: var(--accent); text-transform: uppercase; }
        .form-group input, .form-group select { padding: 0.6rem; border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 0.9rem; background: white; }

        @media (max-width: 768px) {
            .desktop-only { display: none !important; }
            tbody td, thead th { padding: 0.4rem 0.3rem; }
        }
    </style>
</head>
<body>
    <div id="userbar-root"></div>
    <div class="admin-layout">
        <div id="admin-sidebar-root"></div>
        <main class="admin-main">
            <div class="page-header">
                <h1>Recursos Digitales</h1>
                <button class="btn-primary" onclick="openResModal()">+ Nuevo</button>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Recurso</th>
                            <th class="desktop-only">Tipo</th>
                            <th style="width: 50px; text-align:center;">Color</th>
                            <th style="text-align:right; padding-right:0.8rem;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="resources-body"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="resModalOverlay"><div class="modal">
        <h2 id="modalTitle" style="margin-bottom:1rem; font-size:1.1rem; color:var(--primary-dark);"></h2>
        <div class="form-group"><label>Nombre del Recurso</label><input type="text" id="rNombre" placeholder="Ej: Manual de Convivencia"></div>
        <div class="form-group"><label>Tipo de Archivo</label>
            <select id="rTipo">
                <option value="Excel">Excel (XLSX)</option>
                <option value="Imagen">Imagen (PNG/JPG)</option>
                <option value="Link">Link (URL)</option>
                <option value="Otro">Otro</option>
                <option value="PDF">PDF</option>
                <option value="PowerPoint">PowerPoint (PPTX)</option>
                <option value="Video">Video (MP4)</option>
                <option value="Word">Word (DOCX)</option>
            </select>
        </div>
        <div class="form-group"><label>URL / Enlace</label><input type="url" id="rUrl" placeholder="https://..."></div>
        <div class="form-group"><label>Color de Etiqueta</label><input type="color" id="rColor" value="#5289AD"></div>
        <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1.2rem;">
            <button class="btn-primary" style="background:var(--border);" onclick="closeResModal()">Cancelar</button>
            <button class="btn-primary" id="btnSaveRes" onclick="saveResource()">Guardar</button>
        </div>
    </div></div>

    <script type="module">
        import { initUserbar } from '../js/userbar.js';
        import { initAdminSidebar } from '../js/admin-sidebar.js';
        import { auth, db } from '../js/initFirebase.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { doc, onSnapshot, setDoc, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        await initUserbar({ brandHref: '../index.html' }); await initAdminSidebar();
        try { await enableIndexedDbPersistence(db); } catch(e) {} 

        let allResources = [], editingIdx = -1;
        const cap = (s) => (s || '').toLowerCase().replace(/(^\w|\s\w)/g, m => m.toUpperCase());

        const ICONS = {
            edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4L18.5 2.5z"/></svg>`,
            del: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
            file_pdf: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15h3a2 2 0 0 1 0 4H9"/><path d="M15 15v4h2"/><path d="M15 17h1"/></svg>`,
            file_word: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 12v6"/><path d="M9 18l3-6 3 6"/><path d="M15 18V12"/></svg>`,
            file_excel: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h8"/><path d="M8 17h8"/><path d="M10 11v10"/></svg>`,
            file_ppt: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-4"/><path d="M9 17l3-3 3 3"/></svg>`,
            file_img: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
            file_vid: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`,
            file_link: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
            file_other: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`
        };

        const TYPE_MAP = {
            'PDF': 'file_pdf', 'Word': 'file_word', 'Excel': 'file_excel', 'PowerPoint': 'file_ppt',
            'Imagen': 'file_img', 'Video': 'file_vid', 'Link': 'file_link', 'Otro': 'file_other'
        };

        onAuthStateChanged(auth, (u) => {
            if (!u) { window.location.href = '../index.html'; return; }
            onSnapshot(doc(db, "control", "recursos"), (s) => {
                allResources = s.exists() ? (s.data().items || []) : [];
                renderResources();
            });
        });

        function renderResources() {
            const container = document.getElementById('resources-body');
            container.innerHTML = allResources.map((res, i) => `
                <tr>
                    <td>
                        <div class="res-item">
                            <div class="res-icon" style="background:${res.color}15; color:${res.color};">
                                ${ICONS[TYPE_MAP[res.tipo] || 'file_other']}
                            </div>
                            <div style="font-weight:700;">${cap(res.nombre)}</div>
                        </div>
                    </td>
                    <td class="desktop-only"><span style="font-size:0.7rem; font-weight:800; color:var(--accent); text-transform:uppercase;">${res.tipo}</span></td>
                    <td style="text-align:center;"><div class="color-preview" style="background:${res.color}; margin:0 auto;"></div></td>
                    <td style="padding-right:0.6rem;">
                        <div class="actions-cell">
                            <button class="btn-action action-edit" onclick="openResModal(${i})" title="Editar">${ICONS.edit}</button>
                            <button class="btn-action action-delete" onclick="deleteResource(${i})" title="Eliminar">${ICONS.del}</button>
                        </div>
                    </td>
                </tr>`).join('') || '<tr><td colspan="4" style="text-align:center; padding:2rem; color:var(--accent);">No hay recursos registrados.</td></tr>';
        }

        window.openResModal = (idx = -1) => {
            editingIdx = idx;
            const res = idx === -1 ? { nombre:'', tipo:'PDF', url:'', color:'#5289AD' } : allResources[idx];
            document.getElementById('modalTitle').innerText = idx === -1 ? 'Nuevo Recurso' : 'Editar Recurso';
            document.getElementById('rNombre').value = res.nombre;
            document.getElementById('rTipo').value = res.tipo;
            document.getElementById('rUrl').value = res.url || '';
            document.getElementById('rColor').value = res.color;
            document.getElementById('resModalOverlay').classList.add('active');
        };

        window.closeResModal = () => document.getElementById('resModalOverlay').classList.remove('active');

        window.saveResource = async () => {
            const nombre = document.getElementById('rNombre').value.trim();
            const tipo = document.getElementById('rTipo').value;
            const url = document.getElementById('rUrl').value.trim();
            const color = document.getElementById('rColor').value;
            if(!nombre) return;
            
            try {
                let newList = [...allResources];
                const data = { nombre, tipo, url, color };
                if(editingIdx === -1) newList.push(data); else newList[editingIdx] = data;
                
                await setDoc(doc(db, "control", "recursos"), { items: newList }, { merge: true });
                closeResModal();
            } catch(e) { console.error(e); }
        };

        window.deleteResource = async (idx) => {
            if(!confirm(`¿Eliminar el recurso "${allResources[idx].nombre}"?`)) return;
            try {
                let newList = allResources.filter((_, i) => i !== idx);
                await setDoc(doc(db, "control", "recursos"), { items: newList }, { merge: true });
            } catch(e) { console.error(e); }
        };
    </script>
</body>
</html>
