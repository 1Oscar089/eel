<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deméritos y Redenciones - Iconic Edition</title>
    
    <link href='https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preload" href="../css/userbar.css" as="style">
    <link rel="preload" href="../css/admin-sidebar.css" as="style">
    <link rel="preload" href="../css/styles.css" as="style">
    
    <link rel="stylesheet" href="../css/userbar.css">
    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/styles.css">
    
    <style>
        :root { --primary-dark:#243C4C; --primary-steel:#5289AD; --accent:#698696; --border:#ACBCBF; --bg-light:#F4FCFB; --danger:#dc2626; --warning:#f59e0b; --success:#16a34a; --gap:0.5rem; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif !important; }
        
        /* BLOQUEO ESTRUCTURAL DE SCROLL Y MÁRGENES */
        html, body { background: var(--bg-light); color: var(--primary-dark); width: 100vw !important; max-width: 100vw !important; overflow-x: hidden !important; overflow-y: hidden; position: relative; }
        .admin-main { height: calc(100vh - 60px); width: 100% !important; overflow-y: auto; overflow-x: hidden !important; -ms-overflow-style: none; scrollbar-width: none; padding: var(--gap); }
        .admin-main::-webkit-scrollbar { display: none; }

        /* ESTILOS ESTRICTAMENTE ESPECÍFICOS PARA ESTE MÓDULO */
        .header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; width: 100%;}
        .btn-link { 
            background: white; 
            border: 1px solid var(--border); 
            color: var(--primary-steel); 
            padding: 0.5rem 0.8rem; 
            border-radius: 8px; 
            font-weight: 800; 
            font-size: 0.75rem; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 0.3rem; 
            transition: 0.2s; 
        }
        .btn-link:hover { background: #e0f2fe; border-color: var(--primary-steel); }

        /* TABS BLINDADOS */
        .module-tabs-nav { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 0.5rem; 
            margin-bottom: 1.5rem; 
            border-bottom: 2px solid var(--border); 
            padding-bottom: 0.8rem; 
            width: 100%;
        }
        
        .m-tab-btn { 
            flex: 1; 
            min-width: 140px; 
            background: transparent; 
            border: 1px solid transparent; 
            padding: 0.6rem 0.5rem; 
            font-size: 0.85rem; 
            font-weight: 800; 
            color: var(--accent); 
            cursor: pointer; 
            border-radius: var(--border-radius-md); 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 0.4rem; 
            text-align: center;
        }
        .m-tab-btn:hover { color: var(--primary-steel); background: rgba(82, 137, 173, 0.05); }
        .m-tab-btn.active { 
            background: var(--primary-dark); 
            color: white; 
            border-color: var(--primary-dark); 
        }

        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Resultados del Buscador de Estudiantes */
        .search-container { position: relative; margin-bottom: 1.5rem; }
        .search-results { 
            position: absolute; 
            top: 100%; 
            left: 0; 
            width: 100%; 
            background: white; 
            border: 1px solid var(--border); 
            border-radius: 0 0 8px 8px; 
            max-height: 200px; 
            overflow-y: auto; 
            z-index: 100; 
            display: none; 
            box-shadow: var(--shadow-lg); 
        }
        .result-item { padding: 0.8rem 1rem; cursor: pointer; border-bottom: 1px solid var(--bg-light); display: flex; flex-direction: column; }
        .result-item:last-child { border-bottom: none; }
        .result-item:hover { background: #f0f8ff; color: var(--primary-steel); }
        .result-item strong { font-size: 0.85rem; font-weight: 800; }
        .result-item small { font-size: 0.65rem; color: var(--accent); font-weight: 700; margin-top: 0.2rem;}

        /* HISTORIAL GRID */
        .hist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--gap); margin-top: 1rem; }
        .hist-card { 
            background: white; 
            border: 1px solid var(--border); 
            border-radius: var(--border-radius-lg); 
            padding: 1rem; 
            cursor: pointer; 
            transition: 0.2s; 
            box-shadow: var(--shadow-sm); 
        }
        .hist-card:hover { border-color: var(--primary-steel); box-shadow: var(--shadow-md); transform: translateY(-2px);}
        .hist-card h4 { font-size: 0.95rem; font-weight: 800; margin-bottom: 0.2rem; color: var(--primary-dark); }
        .hist-card p { font-size: 0.7rem; color: var(--accent); font-weight: 700; margin-bottom: 0.8rem; }
        .hist-stats { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 800; padding-top: 0.5rem; border-top: 1px dashed var(--border); }
        .stat-dem { color: var(--danger); }
        .stat-red { color: var(--success); }
        .net-badge { text-align: center; font-weight: 800; font-size: 0.8rem; padding: 0.4rem; border-radius: 6px; margin-top: 0.5rem; }

        /* Detalles Modal Historial */
        .history-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .history-table th { background: var(--bg-light); padding: 0.6rem; text-align: left; font-weight: 800; color: var(--accent); border-bottom: 1px solid var(--border); position: sticky; top: 0; }
        .history-table td { padding: 0.6rem; border-bottom: 1px solid var(--bg-light); color: var(--primary-dark); font-weight: 600; vertical-align: top;}
        .tag { padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; white-space: nowrap; }
        .tag-demerito { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca;}
        .tag-redencion { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0;}

        /* AJUSTES RESPONSIVOS */
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .history-table th { font-size: 0.6rem; padding: 0.4rem;}
            .history-table td { font-size: 0.75rem; padding: 0.4rem;}

            .header-actions { 
                display: grid; 
                grid-template-columns: 1fr 1fr; 
                gap: 0.5rem; 
            }
            .btn-link { justify-content: center; font-size: 0.75rem; padding: 0.6rem 0.2rem; }

            .module-tabs-nav {
                border-bottom: none; 
                padding-bottom: 0.5rem;
            }
            .m-tab-btn {
                font-size: 0.75rem;
                padding: 0.7rem 0.2rem;
                border: 1px solid var(--border); 
            }
            .m-tab-btn.active {
                border-color: var(--primary-dark);
            }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>
    <div id="userbar-root"></div>
    
    <div class="admin-layout">
        <div id="admin-sidebar-root"></div>
        
        <main class="admin-main">
            
            <div class="page-header">
                <h1><i class='bx bx-shield-quarter'></i> Control de Conducta</h1>
                <div class="header-actions">
                    <a href="instrumento001.html" class="btn-link"><i class='bx bx-printer'></i> Inst. 001</a>
                    <a href="instrumento002.html" class="btn-link"><i class='bx bx-printer'></i> Inst. 002</a>
                    <a href="instrumento003.html" id="btnInst003" class="btn-link" style="display: none; border-color: var(--warning); color: var(--warning);"><i class='bx bx-shield-quarter'></i> Inst. 003</a>
                    <a href="menciones.html" class="btn-link"><i class='bx bx-medal'></i> Menciones</a>
                </div>
            </div>

            <div class="module-tabs-nav">
                <button class="m-tab-btn active" onclick="switchTab('agregar')">
                    <i class='bx bx-plus-circle'></i> Asignar Puntos
                </button>
                <button class="m-tab-btn" onclick="switchTab('historial')">
                    <i class='bx bx-history'></i> Historial Anual
                </button>
            </div>

            <div id="tab-agregar" class="tab-content active">
                <div class="card">
                    <h2><i class='bx bx-user-plus'></i> Nueva Incidencia / Redención</h2>
                    
                    <div class="search-container">
                        <div class="form-group">
                            <label>Buscar Estudiante (3º a 9º Grado):</label>
                            <input type="text" id="searchEstudiante" placeholder="Escriba 3 letras del apellido o nombre..." autocomplete="off">
                        </div>
                        <div id="resultsEstudiante" class="search-results"></div>
                        <input type="hidden" id="selectedId">
                        <input type="hidden" id="selectedGrade">
                    </div>

                    <div id="formAsignacion" class="form-grid" style="opacity: 0.5; pointer-events: none;">
                        <div class="form-group full-width">
                            <label>Estudiante Seleccionado</label>
                            <input type="text" id="nombreEstudiante" readonly placeholder="Ninguno">
                        </div>
                        <div class="form-group">
                            <label>Fecha de Incidencia</label>
                            <input type="date" id="fechaRegistro">
                        </div>
                        <div class="form-group">
                            <label>Tipo de Registro</label>
                            <select id="tipoRegistro" onchange="actualizarOpciones()">
                                <option value="" disabled selected>-- Seleccione --</option>
                                <option value="Demérito">Demérito (Falta de Conducta)</option>
                                <option value="Redención">Redención (Recuperación)</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label>Causal / Acción Realizada</label>
                            <select id="opcionSelect" onchange="validarFormulario()">
                                <option value="" disabled selected>Seleccione primero el tipo de registro...</option>
                            </select>
                        </div>
                        <div class="full-width" style="margin-top: 1rem;">
                            <button id="btnAsignar" class="btn-primary" onclick="guardarRegistro()" disabled>
                                <i class='bx bx-save'></i> Registrar Acción
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-historial" class="tab-content">
                <div class="card">
                    <h2><i class='bx bx-folder-open'></i> Registros Anuales</h2>
                    
                    <div style="display:flex; gap:1rem; align-items:flex-end; flex-wrap:wrap; margin-bottom: 1rem;">
                        <div class="form-group" style="width: 150px; margin-bottom: 0;">
                            <label>Año a Consultar</label>
                            <input type="number" id="hist_anio" value="2026">
                        </div>
                        <button class="btn-primary" style="width:auto;" onclick="listarConHistorial()">
                            <i class='bx bx-search'></i> Buscar Registros
                        </button>
                    </div>

                    <div id="listaHistorial" class="hist-grid"></div>
                    <div id="msgSinResultados" class="empty-state" style="display:none;">
                        <i class='bx bx-check-shield'></i>
                        <p>Excelente. No se encontraron estudiantes con registros disciplinarios en el año seleccionado.</p>
                    </div>
                </div>
            </div>

            <div style="height: 3rem;"></div>
        </main>
    </div>

    <div id="modalHistorial" class="modal-overlay">
        <div class="modal" style="max-width: 650px;">
            <button class="btn-close-absolute" onclick="cerrarModalHist()"><i class='bx bx-x'></i></button>
            
            <div class="modal-header">
                <div>
                    <h2 id="modalHistTitle">Nombre del Estudiante</h2>
                    <p id="modalHistSubtitle">Historial Disciplinario</p>
                </div>
            </div>
            
            <div class="modal-body" style="padding-right: 0.5rem; max-height: 60vh;">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th style="width:90px;">Fecha</th>
                            <th>Tipo</th>
                            <th>Acción / Causal</th>
                        </tr>
                    </thead>
                    <tbody id="modalHistTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initUserbar } from '../js/userbar.js';
        import { initAdminSidebar } from '../js/admin-sidebar.js';
        import { auth, db } from '../js/initFirebase.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { collection, query, where, getDocs, doc, setDoc, getDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        await initUserbar({ brandHref: '../index.html' }); 
        await initAdminSidebar();

        const OPCIONES_DEMERITO = [
            { letra: "A", texto: "No saludar al entrar o al salir del aula" }, 
            { letra: "B", texto: "Omitir 'Por Favor' al hacer una petición" }, 
            { letra: "C", texto: "Omitir 'Gracias' al recibir un favor, material o atención" }, 
            { letra: "D", texto: "Usar tono grosero o irrespetuoso hacia compañeros, docentes o personal" }
        ];
        
        const OPCIONES_REDENCION = [
            { letra: "A", texto: "Cumplir una semana completa con saludos y expresiones de cortesía ejemplares" }, 
            { letra: "B", texto: "Apoyar voluntariamente en actividades de orden y limpieza escolar" }, 
            { letra: "C", texto: "Participar en campañas de valores organizadas por el centro educativo" }
        ];
        
        const gradeLabels = { '10': 'Parvularia 4', '11': 'Parvularia 5', '12': 'Parvularia 6', '1': 'Primer Grado', '2': 'Segundo Grado', '3': 'Tercer Grado', '4': 'Cuarto Grado', '5': 'Quinto Grado', '6': 'Sexto Grado', '7': 'Séptimo Grado', '8': 'Octavo Grado', '9': 'Noveno Grado' };
        
        const gradeOrder = ['3', '4', '5', '6', '7', '8', '9'];

        let allStudents = [];
        let esDirector = false;
        let misGradosIds = [];
        let globalCacheHistory = {}; 
        let currentUserEmail = ''; 

        // --- SISTEMA DE TOAST ---
        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class='bx ${type === 'success' ? 'bx-check-circle' : 'bx-error-circle'}'></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        };

        const normalizeStr = (str) => {
            return (str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        };

        const getKeys = (fn) => { 
            const w = (fn || '').toLowerCase().split(/\s+/).filter(x => !['de','del','la','las','los','y'].includes(x)); 
            return { a1: w[w.length-2]||w[0]||'', a2: w[w.length-1]||'', n1: w[0]||'' }; 
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const year = new Date().getFullYear();
            // Asegurar fecha local El Salvador
            const d = new Date();
            const localDateStr = d.toLocaleDateString('es-SV', { year: 'numeric', month: '2-digit', day: '2-digit' }).split('/').reverse().join('-');
            document.getElementById('fechaRegistro').value = localDateStr;
            document.getElementById('hist_anio').value = year;

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUserEmail = user.email; 
                    await cargarPerfilDocente(user.email);
                    cargarDatosGlobales();
                } else {
                    window.location.href = '../index.html';
                }
            });
        });

        async function cargarPerfilDocente(email) {
            try {
                const qUser = query(collection(db, "docentes"), where("correo", "==", email));
                const snapUser = await getDocs(qUser);
                
                if (!snapUser.empty) {
                    const userData = snapUser.docs[0].data();
                    if (userData.cargo && ['director', 'subdirector'].includes(userData.cargo.toLowerCase())) {
                        esDirector = true;
                        document.getElementById('btnInst003').style.display = 'flex';
                    }
                    misGradosIds = (userData.grados || []).map(String);
                }
            } catch (error) { console.error("Error al cargar perfil:", error); }
        }

        function cargarDatosGlobales() {
            onSnapshot(collection(db, "users"), (snap) => {
                allStudents = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(s => s.nombreCompleto && !s.archivado);
            });
        }

        function getMisEstudiantes() {
            let estudiantesValidos = allStudents.filter(st => gradeOrder.includes(String(st.grade)));
            if (esDirector) return estudiantesValidos;
            return estudiantesValidos.filter(st => misGradosIds.includes(String(st.grade)));
        }

        // --- SISTEMA DE PESTAÑAS (TABS) ACTUALIZADO ---
        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.m-tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            const tabBtn = document.querySelector(`.m-tab-btn[onclick="switchTab('${tab}')"]`);
            if (tabBtn) tabBtn.classList.add('active');
        };

        // --- BUSCADOR INTELIGENTE ---
        function filtrarEstudiantes(term, container) {
            const cleanTerm = term.trim();
            if (cleanTerm.length < 3) { container.style.display = 'none'; return; }
            
            const misEstudiantes = getMisEstudiantes();
            const normalizedTerm = normalizeStr(cleanTerm);
            
            const filtered = misEstudiantes.filter(st => {
                const normalizedName = normalizeStr(st.nombreCompleto);
                return normalizedName.includes(normalizedTerm);
            });

            filtered.sort((a,b) => { 
                const kA = getKeys(a.nombreCompleto), kB = getKeys(b.nombreCompleto); 
                return kA.a1.localeCompare(kB.a1) || kA.a2.localeCompare(kB.a2) || kA.n1.localeCompare(kB.n1); 
            });

            container.innerHTML = filtered.map(st => {
                const nieText = (st.NIE || st.nie) ? `NIE: ${st.NIE || st.nie}` : '';
                return `
                <div class="result-item" onclick="seleccionarEstudiante('${st.id}', '${st.grade}', '${st.nombreCompleto}')">
                    <div>
                        <strong>${st.nombreCompleto}</strong>
                        <small style="display:block; color:var(--accent);">${gradeLabels[st.grade] || 'Grado '+st.grade} - ${nieText}</small>
                    </div>
                </div>
            `}).join('');
            
            container.style.display = filtered.length ? 'block' : 'none';
        }
        
        document.getElementById('searchEstudiante').addEventListener('input', (e) => filtrarEstudiantes(e.target.value, document.getElementById('resultsEstudiante')));

        window.seleccionarEstudiante = (id, grade, nombre) => {
            document.getElementById('selectedId').value = id;
            document.getElementById('selectedGrade').value = grade;
            document.getElementById('nombreEstudiante').value = nombre;
            
            document.getElementById('formAsignacion').style.opacity = '1';
            document.getElementById('formAsignacion').style.pointerEvents = 'auto';
            document.getElementById('searchEstudiante').value = '';
            document.getElementById('resultsEstudiante').style.display = 'none';
            validarFormulario();
        };

        window.actualizarOpciones = () => {
            const tipo = document.getElementById('tipoRegistro').value;
            const select = document.getElementById('opcionSelect');
            select.innerHTML = '<option value="" disabled selected>-- Seleccione la causal --</option>';
            
            let opciones = (tipo === 'Demérito') ? OPCIONES_DEMERITO : (tipo === 'Redención') ? OPCIONES_REDENCION : [];
            opciones.forEach(opt => select.innerHTML += `<option value="${opt.letra}" data-descripcion="${opt.texto}">${opt.letra}. ${opt.texto}</option>`);
            
            validarFormulario();
        };

        window.validarFormulario = () => {
            const id = document.getElementById('selectedId').value;
            const fecha = document.getElementById('fechaRegistro').value;
            const tipo = document.getElementById('tipoRegistro').value;
            const opc = document.getElementById('opcionSelect').value;
            document.getElementById('btnAsignar').disabled = !(id && fecha && tipo && opc);
        };
        
        // --- GUARDAR REGISTRO ---
        window.guardarRegistro = async () => {
            const btn = document.getElementById('btnAsignar'); 
            btn.disabled = true; 
            btn.innerHTML = "<i class='bx bx-loader bx-spin'></i> Guardando...";
            
            const id = document.getElementById('selectedId').value;
            const grade = document.getElementById('selectedGrade').value;
            const anio = document.getElementById('fechaRegistro').value.split('-')[0];
            const select = document.getElementById('opcionSelect');
            const tipoStr = document.getElementById('tipoRegistro').value;
            
            const ts = new Date().getTime();
            const tipoDoc = tipoStr === 'Demérito' ? 'demeritos' : 'redenciones';
            const recId = (tipoStr === 'Demérito' ? 'dem_' : 'red_') + ts;
            
            const payload = { 
                fecha: document.getElementById('fechaRegistro').value, 
                tipo: tipoStr, 
                letra: select.value, 
                descripcion: select.options[select.selectedIndex].dataset.descripcion, 
                timestamp: ts,
                registradoPor: currentUserEmail 
            };
            
            try { 
                const batch = writeBatch(db);
                
                batch.set(doc(db, "users", id, "metadata", tipoDoc), {
                    [recId]: payload
                }, { merge: true });

                batch.update(doc(db, "users", id), {
                    [`conducta_history.${anio}`]: grade
                });

                await batch.commit(); 
                
                showToast("Registro disciplinario guardado con éxito."); 
                
                // Reiniciar Formulario
                document.getElementById('tipoRegistro').value = ""; 
                document.getElementById('opcionSelect').innerHTML = '<option value="" disabled selected>Seleccione primero el tipo...</option>'; 
                document.getElementById('selectedId').value = "";
                document.getElementById('nombreEstudiante').value = "";
                document.getElementById('formAsignacion').style.opacity = '0.5';
                document.getElementById('formAsignacion').style.pointerEvents = 'none';
                
            } catch (e) { 
                showToast("Error al guardar: " + e.message, "error"); 
            } finally { 
                btn.disabled = false; 
                btn.innerHTML = "<i class='bx bx-save'></i> Registrar Acción"; 
            }
        };

        // --- LISTAR HISTORIAL ---
        window.listarConHistorial = async () => {
            const anio = document.getElementById('hist_anio').value;
            const container = document.getElementById('listaHistorial');
            const msg = document.getElementById('msgSinResultados');
            const btn = document.querySelector('.btn-primary[onclick="listarConHistorial()"]');
            
            if(!anio) return;

            btn.innerHTML = "<i class='bx bx-loader bx-spin'></i> Buscando...";
            container.innerHTML = "";
            msg.style.display = 'none';
            globalCacheHistory = {};

            const misEstudiantes = getMisEstudiantes();
            
            let filtrados = misEstudiantes.filter(s => s.conducta_history && s.conducta_history[anio]);

            if(filtrados.length === 0) { 
                msg.style.display = 'block'; 
                btn.innerHTML = "<i class='bx bx-search'></i> Buscar Registros";
                return; 
            }

            filtrados.sort((a,b) => { 
                const kA = getKeys(a.nombreCompleto), kB = getKeys(b.nombreCompleto); 
                return kA.a1.localeCompare(kB.a1) || kA.a2.localeCompare(kB.a2) || kA.n1.localeCompare(kB.n1); 
            });

            let htmlContent = "";

            // Filtro estricto: Solo iteramos los grados asignados al docente (o todos si es director)
            const gradosPermitidos = esDirector ? gradeOrder : gradeOrder.filter(g => misGradosIds.includes(g));

            for(let i = 0; i < gradosPermitidos.length; i++) {
                const gradoCode = gradosPermitidos[i];
                const studentsInGrade = filtrados.filter(s => String(s.grade) === gradoCode);
                
                if (studentsInGrade.length > 0) {
                    htmlContent += `
                        <div style="grid-column: 1 / -1; border-bottom: 2px solid var(--border); margin-top: 1rem; padding-bottom: 0.3rem;">
                            <h3 style="margin:0; color:var(--primary-dark); font-size:1rem; font-weight:800;">${gradeLabels[gradoCode]}</h3>
                        </div>
                    `;
                    
                    await Promise.all(studentsInGrade.map(async (st) => {
                        let demsList = [], redsList = [];
                        try {
                            const dDoc = await getDoc(doc(db, "users", st.id, "metadata", "demeritos"));
                            if(dDoc.exists()) demsList = Object.values(dDoc.data()).filter(r => r.fecha?.startsWith(anio));
                            
                            const rDoc = await getDoc(doc(db, "users", st.id, "metadata", "redenciones"));
                            if(rDoc.exists()) redsList = Object.values(rDoc.data()).filter(r => r.fecha?.startsWith(anio));
                        } catch(e){}

                        const dems = demsList.length;
                        const reds = redsList.length;
                        const net = dems - reds;
                        
                        globalCacheHistory[st.id] = [...demsList, ...redsList];

                        if (dems > 0 || reds > 0) {
                            const netColor = net > 0 ? 'var(--danger)' : 'var(--success)';
                            const netBg = net > 0 ? '#fef2f2' : '#f0fdf4';
                            const netText = net > 0 ? `Pendiente: ${net} ptos.` : `Solvente`;
                            const nieText = (st.NIE || st.nie) ? `NIE: ${st.NIE || st.nie}` : '';

                            htmlContent += `
                                <div class="hist-card" onclick="verDetalleHistorial('${st.id}', '${encodeURIComponent(st.nombreCompleto)}', '${anio}', '${st.grade}')">
                                    <h4 title="${st.nombreCompleto}">${st.nombreCompleto}</h4>
                                    <p>${nieText}</p>
                                    
                                    <div class="hist-stats">
                                        <span class="stat-dem">Deméritos: ${dems}</span>
                                        <span class="stat-red">Redenciones: ${reds}</span>
                                    </div>
                                    <div class="net-badge" style="color:${netColor}; background:${netBg};">
                                        ${netText}
                                    </div>
                                </div>
                            `;
                        }
                    }));
                }
            }

            container.innerHTML = htmlContent || '<div class="empty-state" style="grid-column:1/-1;">No hay registros visibles en tus grados asignados para este año.</div>';
            btn.innerHTML = "<i class='bx bx-search'></i> Buscar Registros";
        };

        // --- ABRIR Y CERRAR MODAL DETALLE HISTORIAL ---
        window.verDetalleHistorial = (id, nombreEnc, anio, grade) => {
            const nombre = decodeURIComponent(nombreEnc);
            document.getElementById('modalHistTitle').innerText = nombre;
            document.getElementById('modalHistSubtitle').innerText = `Año Lectivo: ${anio} | ${gradeLabels[grade] || grade}`;
            
            const tbody = document.getElementById('modalHistTableBody');
            tbody.innerHTML = "";

            const registros = globalCacheHistory[id] || [];
            registros.sort((a,b) => new Date(b.fecha) - new Date(a.fecha));

            if(registros.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding: 2rem; color: var(--accent); font-style: italic;'>No hay registros detallados.</td></tr>";
            } else {
                registros.forEach(h => {
                    // Formateamos fecha a DD/MM/YYYY si viene en YYYY-MM-DD
                    let fechaVisual = h.fecha;
                    if(fechaVisual && fechaVisual.includes('-')) {
                        const [y, m, d] = fechaVisual.split('-');
                        fechaVisual = `${d}/${m}/${y}`;
                    }

                    const tagClass = h.tipo === 'Demérito' ? 'tag-demerito' : 'tag-redencion';
                    tbody.innerHTML += `<tr>
                        <td>${fechaVisual}</td>
                        <td><span class="tag ${tagClass}">${h.tipo} (${h.letra})</span></td>
                        <td>
                            ${h.descripcion}
                            <div style="font-size: 0.65rem; color: var(--accent); margin-top: 4px; font-weight: 700;">
                                <i class='bx bx-user'></i> Registrado por: ${h.registradoPor || 'N/A'}
                            </div>
                        </td>
                    </tr>`;
                });
            }

            document.getElementById('modalHistorial').classList.add('active');
        };

        window.cerrarModalHist = () => {
            document.getElementById('modalHistorial').classList.remove('active');
        };

    </script>
</body>
</html>
