<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrícula y Promoción - Iconic Edition</title>
    <link rel="preload" href="../css/userbar.css" as="style"><link rel="preload" href="../css/admin-sidebar.css" as="style">
    <link rel="stylesheet" href="../css/userbar.css"><link rel="stylesheet" href="../css/admin-sidebar.css">
    <style>
        :root { --primary-dark:#243C4C; --primary-steel:#5289AD; --accent:#698696; --border:#ACBCBF; --bg-light:#F4FCFB; --gap:0.5rem; --success:#16a34a; --warning:#d97706; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif !important; }
        
        html, body { background: var(--bg-light); color: var(--primary-dark); width: 100vw !important; max-width: 100vw !important; overflow-x: hidden !important; overflow-y: hidden; position: relative; }
        .admin-main { height: calc(100vh - 60px); width: 100% !important; overflow-y: auto; overflow-x: hidden !important; -ms-overflow-style: none; scrollbar-width: none; padding: var(--gap); }
        .admin-main::-webkit-scrollbar { display: none; }
        
        .page-header { margin-bottom: var(--gap); display: flex; justify-content: space-between; align-items: center; }
        .page-header h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -1px; }

        /* Controles de Promoción */
        .controls-card { background: white; padding: 1rem; border-radius: 14px; border: 1px solid var(--border); margin-bottom: var(--gap); display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: center; box-shadow: 0 4px 15px rgba(36,60,76,0.03); }
        .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .form-group label { font-size: 0.65rem; font-weight: 800; color: var(--accent); text-transform: uppercase; }
        .form-group select { padding: 0.7rem; border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 0.9rem; font-weight: 700; color: var(--primary-dark); background: var(--bg-light); }
        
        .transfer-icon { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; background: #eff6ff; color: #3b82f6; border-radius: 50%; margin-top: 1rem; }
        .transfer-icon svg { width: 20px; height: 20px; stroke-width: 2.5; }

        /* Tabla de Estudiantes */
        .table-card { background: white; border-radius: 12px; border: 1px solid var(--border); width: 100%; overflow: hidden; margin-bottom: 5rem; }
        table { width: 100%; border-collapse: collapse; table-layout: auto; }
        thead th { background: var(--bg-light); padding: 0.6rem 0.5rem; font-size: 0.65rem; font-weight: 800; color: var(--accent); text-align: left; border-bottom: 1px solid var(--border); text-transform: uppercase; }
        tbody td { padding: 0.5rem; font-size: 0.85rem; border-bottom: 1px solid var(--bg-light); vertical-align: middle; }
        
        .student-row.selected { background: #f0fdf4; }
        .cb-custom { width: 16px; height: 16px; accent-color: var(--primary-steel); cursor: pointer; }

        .name-cell { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; }
        .avatar-sm { width: 28px; height: 28px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.65rem; flex-shrink: 0; }

        .btn-primary { background: var(--primary-dark); color: white; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; border: none; transition: 0.2s; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Barra Inferior Flotante */
        .save-bar { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: white; padding: 0.8rem 1.5rem; border-radius: 50px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); border: 1px solid var(--border); z-index: 1000; display: flex; gap: 1rem; align-items: center; }
        .save-bar-info { font-size: 0.8rem; font-weight: 700; color: var(--accent); }

        @media (max-width: 768px) {
            .controls-card { grid-template-columns: 1fr; gap: 0.5rem; padding: 0.8rem; }
            .transfer-icon { transform: rotate(90deg); margin: 0 auto; width: 30px; height: 30px; }
            .desktop-only { display: none !important; }
            tbody td, thead th { padding: 0.4rem 0.3rem; }
        }
    </style>
</head>
<body>
    <div id="userbar-root"></div>
    <div class="admin-layout">
        <div id="admin-sidebar-root"></div>
        <main class="admin-main">
            <div class="page-header">
                <h1>Matrícula y Promoción</h1>
            </div>

            <div class="controls-card">
                <div class="form-group">
                    <label>Grado Actual (Origen)</label>
                    <select id="sourceGrade" onchange="handleSourceChange()">
                        <option value="" disabled selected>Cargando grados...</option>
                    </select>
                </div>
                <div class="transfer-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                </div>
                <div class="form-group">
                    <label>Promover A (Destino)</label>
                    <select id="targetGrade">
                        <option value="" disabled selected>Seleccione origen primero</option>
                    </select>
                </div>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 40px; text-align: center;"><input type="checkbox" class="cb-custom" id="selectAll" onchange="toggleAll()"></th>
                            <th>Estudiante</th>
                            <th class="desktop-only">NIE</th>
                        </tr>
                    </thead>
                    <tbody id="studentsBody">
                        <tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--accent);">Selecciona un grado de origen para ver a los estudiantes.</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="save-bar" id="actionMenu" style="display: none;">
        <span class="save-bar-info" id="selectionCount">0 seleccionados</span>
        <button class="btn-primary" id="btnPromote" onclick="executePromotion()">Aplicar Promoción</button>
    </div>

    <script type="module">
        import { initUserbar } from '../js/userbar.js';
        import { initAdminSidebar } from '../js/admin-sidebar.js';
        import { auth, db } from '../js/initFirebase.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { collection, onSnapshot, doc, writeBatch, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        await initUserbar({ brandHref: '../index.html' }); await initAdminSidebar();
        try { await enableIndexedDbPersistence(db); } catch(e) {} 

        let allGrades = {};
        let orderedGradeIds = [];
        let allStudents = [];
        let currentStudents = [];

        const cap = (s) => (s || '').toLowerCase().replace(/(^\w|\s\w)/g, m => m.toUpperCase());

        onAuthStateChanged(auth, (u) => {
            if (!u) { window.location.href = '../index.html'; return; }
            
            // 1. CARGA DE GRADOS
            onSnapshot(doc(db, "control", "grados"), (s) => {
                if(s.exists()) {
                    allGrades = s.data();
                    orderedGradeIds = Object.keys(allGrades).sort((a,b) => parseInt(a) - parseInt(b));
                    
                    const srcSel = document.getElementById('sourceGrade');
                    srcSel.innerHTML = '<option value="" disabled selected>Selecciona un grado...</option>' + 
                        orderedGradeIds.map(id => `<option value="${id}">${cap(allGrades[id].nombre || allGrades[id])}</option>`).join('');
                }
            });

            // 2. CARGA DE ESTUDIANTES (Solo activos)
            onSnapshot(collection(db, "users"), (snap) => {
                allStudents = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(s => s.nombreCompleto && !s.archivado);
                if(document.getElementById('sourceGrade').value) {
                    handleSourceChange(); // Re-renderizar si ya hay un grado seleccionado
                }
            });
        });

        window.handleSourceChange = () => {
            const src = document.getElementById('sourceGrade').value;
            const tgtSel = document.getElementById('targetGrade');
            
            if(!src) return;

            // Encontrar el grado siguiente en la secuencia numérica
            const currentIndex = orderedGradeIds.indexOf(src);
            const isLastGrade = currentIndex === orderedGradeIds.length - 1;

            tgtSel.innerHTML = orderedGradeIds.map(id => 
                `<option value="${id}">${cap(allGrades[id].nombre || allGrades[id])}</option>`
            ).join('') + `<option value="archive" style="font-weight:800; color:var(--danger);">Egresar / Archivar</option>`;

            // Lógica Automática
            if(isLastGrade) {
                tgtSel.value = 'archive';
            } else {
                tgtSel.value = orderedGradeIds[currentIndex + 1];
            }

            // Filtrar y renderizar estudiantes
            currentStudents = allStudents.filter(s => s.grade === src).sort((a,b) => a.nombreCompleto.localeCompare(b.nombreCompleto));
            renderStudents();
        };

        function renderStudents() {
            const tbody = document.getElementById('studentsBody');
            document.getElementById('selectAll').checked = false;
            updateSelection();

            if(currentStudents.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--accent);">No hay estudiantes activos en este grado.</td></tr>`;
                return;
            }

            tbody.innerHTML = currentStudents.map(s => {
                const parts = cap(s.nombreCompleto).split(' ');
                const initials = (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();
                
                // Lee de s.nie (minúscula) que es como se guarda en la DB, con fallback a s.NIE
                const nieValue = s.nie || s.NIE || '---';

                return `
                <tr class="student-row" id="row-${s.id}">
                    <td style="text-align:center;">
                        <input type="checkbox" class="cb-custom student-cb" value="${s.id}" onchange="updateSelection()">
                    </td>
                    <td>
                        <div class="name-cell">
                            <div class="avatar-sm" style="background:${s.color || '#5289AD'}">${initials}</div>
                            <span>${cap(s.nombreCompleto)}</span>
                        </div>
                    </td>
                    <td class="desktop-only" style="font-family:monospace;">${nieValue}</td>
                </tr>`;
            }).join('');
        }

        window.toggleAll = () => {
            const isChecked = document.getElementById('selectAll').checked;
            document.querySelectorAll('.student-cb').forEach(cb => cb.checked = isChecked);
            updateSelection();
        };

        window.updateSelection = () => {
            const selected = document.querySelectorAll('.student-cb:checked');
            
            // Resaltar filas seleccionadas
            document.querySelectorAll('.student-row').forEach(row => row.classList.remove('selected'));
            selected.forEach(cb => document.getElementById(`row-${cb.value}`).classList.add('selected'));

            const count = selected.length;
            const bar = document.getElementById('actionMenu');
            document.getElementById('selectionCount').innerText = `${count} seleccionado${count !== 1 ? 's' : ''}`;
            
            if(count > 0) {
                bar.style.display = 'flex';
            } else {
                bar.style.display = 'none';
                document.getElementById('selectAll').checked = false;
            }
        };

        window.executePromotion = async () => {
            const tgt = document.getElementById('targetGrade').value;
            const selectedCbs = document.querySelectorAll('.student-cb:checked');
            
            if(selectedCbs.length === 0) return;
            
            const tgtName = tgt === 'archive' ? 'Egresar / Archivar' : cap(allGrades[tgt]?.nombre || tgt);
            if(!confirm(`¿Aplicar acción "${tgtName}" a ${selectedCbs.length} estudiante(s)?`)) return;

            const btn = document.getElementById('btnPromote');
            btn.disabled = true;
            btn.innerText = "Procesando...";

            try {
                // USO DE BATCH: Operación atómica de alto rendimiento
                const batch = writeBatch(db);
                
                selectedCbs.forEach(cb => {
                    const ref = doc(db, "users", cb.value);
                    if(tgt === 'archive') {
                        batch.update(ref, { archivado: true });
                    } else {
                        batch.update(ref, { grade: tgt });
                    }
                });

                await batch.commit();
                
                // La UI se refrescará automáticamente gracias al onSnapshot de 'users'
                document.getElementById('actionMenu').style.display = 'none';
            } catch(e) {
                console.error(e);
                alert("Error al aplicar la promoción.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Aplicar Promoción";
            }
        };
    </script>
</body>
</html>
